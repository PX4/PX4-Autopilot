module_name: MSP OSD
serial_config:
    - command: msp_osd start -d ${SERIAL_DEV}
      port_config_param:
        name: MSP_OSD_CONFIG
        group: OSD

parameters:
    - group: OSD
      definitions:

        # RC Stick input
        OSD_RC_STICK:
            description:
                short: OSD RC Stick commands
                long: |
                    Forward RC stick input to VTX when disarmed
            type: int32
            min: 0
            max: 1
            default: 1

module_name: atxxxx
parameters:
- group: OSD
  definitions:
    OSD_ATXXXX_CFG:
      description:
        short: Enable/Disable the ATXXX OSD Chip
        long: |-
          Configure the ATXXXX OSD Chip (mounted on the OmnibusF4SD board) and
          select the transmission standard.
      type: enum
      values:
        0: Disabled
        1: NTSC
        2: PAL
      default: 0
      reboot_required: true

    OSD_VOLT_MODE:
      description:
        short: Analog OSD battery voltage display
        long: |-
          Selects what the battery voltage element shows. Both readings come
          from the same measurement, so only one is drawn.
      type: enum
      values:
        0: Pack voltage
        1: Average cell voltage
      default: 0

    OSD_PWR_MODE:
      description:
        short: Analog OSD power draw display
        long: |-
          Selects what the power draw element shows. Watts are derived from the
          same current measurement, so only one is drawn.
      type: enum
      values:
        0: Current in amps
        1: Power in watts
      default: 0

    OSD_VTX_MODE:
      description:
        short: Analog OSD video transmitter display
        long: |-
          Selects what the VTX element shows: the configured band, channel and
          power level, or the resulting frequency and output power.
      type: enum
      values:
        0: Band, channel and power level
        1: Frequency and power in mW
      default: 0

    OSD_ID_MODE:
      description:
        short: Analog OSD identification display
        long: |-
          Selects what the identification element shows: the MAVLink system ID,
          the MAVLink vehicle state, or both.
      type: enum
      values:
        0: System ID and MAV state
        1: System ID only
        2: MAV state only
      default: 0
    OSD_BAT_VOLT_X:
        description:
            short: Analog OSD battery voltage X position
        type: int32
        min: 0
        max: 29
        default: 1

    OSD_BAT_VOLT_Y:
        description:
            short: Analog OSD battery voltage Y position
        type: int32
        min: 0
        max: 15
        default: 1

    OSD_MAH_X:
        description:

module_name: ll40ls
parameters:
- group: Sensors
  definitions:
    SENS_EN_LL40LS:
      description:
        short: Lidar-Lite (LL40LS)
      type: enum
      values:
        0: Disabled
        1: PWM
        2: I2C
      default: 0
      reboot_required: true
      min: 0
      max: 2
    SENS_LL40LS_SMIN:
      description:
        short: Min signal strength for V3HP
      type: int32
      default: 70
      reboot_required: true
      min: 0
      max: 254

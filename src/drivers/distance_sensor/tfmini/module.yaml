module_name: Benewake TFmini Rangefinder
serial_config:
    - command: tfmini start -d ${SERIAL_DEV}
      protocol_id: 30
      protocol_name: TFmini

parameters:
    - group: Sensors
      definitions:
        SENS_TFMINI_HW:
            description:
                short: Hardware Model
                long: Models differ in range and FoV.
            type: enum
            values:
                1: TFMINI
                2: ISTRA24
                3: ISTRA24_100m
            min: 1
            max: 3
            default: 1
            reboot_required: true

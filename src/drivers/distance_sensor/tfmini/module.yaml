module_name: Benewake TFmini Rangefinder
serial_config:
    - command: tfmini start -d ${SERIAL_DEV}
      port_config_param:
        name: SENS_TFMINI_CFG
        group: Sensors

parameters:
    - group: Sensors
      definitions:
        SENS_TFMINI_HW:
            description:
                short: Hardware Model
                long: Models differ in range and FoV.
            type: enum
            values:
                1: TFMINI (discontinued)
                2: ISTRA24
                3: ISTRA24_100m
                4: TFMINI Plus
                5: TFMINI-S
            min: 1
            max: 5
            default: 5
            reboot_required: true

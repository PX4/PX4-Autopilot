module_name: ina228
parameters:
- group: Sensors
  definitions:
    SENS_EN_INA228:
      description:
        short: Enable INA228 Power Monitor
        long: For systems with an INA228 Power Monitor, this should be set to true
      type: boolean
      default: 0
      reboot_required: true
    INA228_RATE:
      description:
        short: INA228 Power Monitor sample rate
        long: |-
          Rate at which the device is sampled and battery_status is published.
          Each sample is triggered by the driver, so the delay between the
          measurement and its publication is constant.

          Each rate uses the longest integration time (conversion time x
          averaging) that fits in one interval, with at least 540 us per bus
          and shunt conversion, so higher rates have more noise per sample
          (about 3x at 100 Hz compared to 10 Hz). Averaged down to 10 Hz the
          noise is about the same.
          At 100 Hz one device takes about 21 % of a 100 kHz I2C bus.
      type: enum
      values:
        10: 10 Hz
        20: 20 Hz
        50: 50 Hz
        100: 100 Hz
      default: 10
      reboot_required: true
    INA228_CURRENT:
      description:
        short: INA228 Power Monitor Max Current
      type: float
      default: 327.68
      min: 0.1
      max: 1638.40
      decimal: 2
      increment: 0.1
      reboot_required: true
    INA228_SHUNT:
      description:
        short: INA228 Power Monitor Shunt
      type: float
      default: 0.0005
      min: 1.0e-09
      max: 0.1
      decimal: 10
      increment: 1.0e-09
      reboot_required: true

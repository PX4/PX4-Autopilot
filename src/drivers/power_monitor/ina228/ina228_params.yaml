module_name: ina228
parameters:
- group: Sensors
  definitions:
    SENS_EN_INA228:
      description:
        short: Enable INA228 Power Monitor
        long: For systems with an INA228 Power Monitor, this should be set to true
      type: boolean
      default: 0
      reboot_required: true
    INA228_CONFIG:
      description:
        short: INA228 Power Monitor ADC config
        long: |-
          Value written to the ADC_CONFIG register. It sets which channels are
          converted, the conversion time per channel, the averaging and whether
          the ADC runs continuously or is triggered by the driver for each sample.

          Bits 15-12 MODE: 1..7 triggered, 9..15 continuous; bit 0 bus voltage,
          bit 1 shunt voltage, bit 2 temperature (bus and shunt are required).
          Bits 11-9 VBUSCT, 8-6 VSHCT, 5-3 VTCT: conversion time
          0..7 = 50, 84, 150, 280, 540, 1052, 2074, 4120 us.
          Bits 2-0 AVG: 0..7 = 1, 4, 16, 64, 128, 256, 512, 1024 samples.

          One output sample takes AVG x (sum of the enabled conversion times).
          The driver reads the device every 100 ms, or slower if one sample takes
          longer. Default 63779 (0xF923): continuous, 103.68 ms per sample.
      type: int32
      default: 63779
      min: 0
      max: 65535
      decimal: 1
      increment: 1
      reboot_required: true
    INA228_CURRENT:
      description:
        short: INA228 Power Monitor Max Current
      type: float
      default: 327.68
      min: 0.1
      max: 1638.40
      decimal: 2
      increment: 0.1
      reboot_required: true
    INA228_SHUNT:
      description:
        short: INA228 Power Monitor Shunt
      type: float
      default: 0.0005
      min: 1.0e-09
      max: 0.1
      decimal: 10
      increment: 1.0e-09
      reboot_required: true

module_name: GHST RC Input Driver
serial_config:
    - command: "ghst_rc start -d ${SERIAL_DEV}"
      protocol_id: 13
      protocol_name: GHST

parameters:
    - group: RC
      definitions:
        RC_GHST_TEL_EN:
            description:
                short: Ghost RC telemetry enable
                long: |
                    Ghost telemetry enable

            type: boolean
            default: [0]

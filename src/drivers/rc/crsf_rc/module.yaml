module_name: CRSF RC Input Driver
serial_config:
    - command: "crsf_rc start -d ${SERIAL_DEV}"
      protocol_id: 12
      protocol_name: CRSF

parameters:
    - group: RC
      definitions:
        RC_CRSF_TEL_EN:
            description:
                short: Crossfire RC telemetry enable
                long: |
                    Crossfire telemetry enable

            type: boolean
            default: [0]

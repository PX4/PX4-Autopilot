module_name: Serial Passthrough (MAVLink)

parameters:
    - group: Serial Passthrough
      definitions:
        PASSTHRU_EN:
            description:
                short: Serial passthrough mode
                long: When not 0, dshot and pwm_out are not started at boot and the parameter resets to 0, so the next boot starts them again.
            type: enum
            values:
                0: Disabled
                1: MAVLink serial passthrough (SERIAL_CONTROL to the ESC pins)
                2: USB ESC configuration server (esc_4way instead of MAVLink, for am32.ca or esc-configurator.com)
            default: 0
            reboot_required: true

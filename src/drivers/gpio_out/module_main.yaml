module_name: GPIO Output

parameters:
  - group: Actuator Outputs
    definitions:
      PWM_MAIN_GPIO_EN:
        description:
          short: Enable GPIO output mode per channel on PWM Main
          long: |
              Selecting which channels are driven as plain digital (on/off) outputs.
        type: bitmask
        bit:
          0: Put CH1 in GPIO mode
          1: Put CH2 in GPIO mode
          2: Put CH3 in GPIO mode
          3: Put CH4 in GPIO mode
          4: Put CH5 in GPIO mode
          5: Put CH6 in GPIO mode
          6: Put CH7 in GPIO mode
          7: Put CH8 in GPIO mode
          8: Put CH9 in GPIO mode
          9: Put CH10 in GPIO mode
          10: Put CH11 in GPIO mode
          11: Put CH12 in GPIO mode
          12: Put CH13 in GPIO mode
          13: Put CH14 in GPIO mode
          14: Put CH15 in GPIO mode
          15: Put CH16 in GPIO mode
        default: 0
        reboot_required: true

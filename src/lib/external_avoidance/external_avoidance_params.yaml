module_name: external_avoidance
parameters:
- group: Multicopter Position Control
  definitions:
    EAV_EN:
      description:
        short: Enable external avoidance setpoint fusion
        long: |-
          When enabled, velocity/acceleration setpoints streamed from an external
          companion computer (via MAVLink SET_POSITION_TARGET_LOCAL_NED) are fused
          into Position and Mission mode as a temporary obstacle-avoidance deviation.

          The external companion is responsible for all obstacle detection and
          avoidance logic; PX4 only accepts and blends the resulting setpoint. When
          the external stream stops (see EAV_TIMEOUT) the normal Position/Mission
          setpoint automatically resumes.
      type: boolean
      default: 0
    EAV_TIMEOUT:
      description:
        short: External avoidance setpoint timeout
        long: |-
          Maximum age of an external avoidance setpoint before it is ignored. If no
          fresh setpoint is received within this time, fusion stops and the vehicle
          resumes its normal Position/Mission setpoint.
      type: float
      default: 0.5
      min: 0.1
      max: 5.0
      unit: s
      decimal: 2

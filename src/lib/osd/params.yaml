module_name: OSD
parameters:
    - group: OSD
      definitions:

        # OSD Parameters
        OSD_SYMBOLS:
            description:
                short: OSD Symbol Selection
                long: |
                  Selects which display elements the OSD drivers draw. Bits are shared
                  between the MSP and analog drivers, so a bit that only one of them
                  implements is marked with the driver that honours it.
                  Bits 22 and up are elements only the analog driver provides.
            type: bitmask
            bit:
                0: CRAFT_NAME / SYSID
                1: DISARMED
                2: GPS_LAT
                3: GPS_LON
                4: GPS_SATS
                5: GPS_SPEED
                6: HOME_DIST
                7: (unused) HOME_DIR
                8: (analog) BATT_VOLTAGE
                9: CURRENT_DRAW
                10: MAH_DRAWN
                11: RSSI_VALUE
                12: ALTITUDE
                13: (analog) NUMERICAL_VARIO
                14: (analog) FLYMODE
                15: (unused) ESC_TMP
                16: PITCH_ANGLE
                17: (MSP) ROLL_ANGLE
                18: CROSSHAIRS
                19: (MSP) AVG_CELL_VOLTAGE
                20: (unused) HORIZON_SIDEBARS
                21: (unused) POWER
                22: (analog) MISSION_STATE
                23: (analog) LINK_QUALITY
                24: (analog) FLIGHT_TIME
                25: (analog) STATUS_MESSAGE
                26: (analog) ARTIFICIAL_HORIZON
                27: (analog) HEADING
                28: (analog) VTX_STATUS
                29: (analog) THROTTLE
                30: (analog) GPS_INFO
            default: 16383

        # OSD Crosshairs Vertical Position
        OSD_CH_POS_VER:
            description:
                short: OSD Crosshairs Vertical Position
                long: |
                  Controls the vertical position of the crosshair display.
                  Resolution is limited by OSD to 15 discrete values. Negative
                  values will display the crosshairs below the horizon
            type: int32
            default: 0
            min: -8
            max: 8

        # OSD Crosshairs Horizontal Position
        OSD_CH_POS_HOR:
            description:
                short: OSD Crosshairs Horizontal Position
                long: |
                  Controls the horizontal position of the crosshair display.
                  Resolution is limited by OSD to 15 discrete values. Negative
                  values will display the crosshairs left of the center of the screen
            type: int32
            default: 0
            min: -8
            max: 8

        # OSD Log Level
        OSD_LOG_LEVEL:
            description:
                short: OSD Warning Level
                long: |
                  Minimum security of log level to display on the OSD.
            type: int32
            bit:
                0: EMERGENCY
                1: ALERT
                2: CRITICAL
                3: ERROR
                4: WARNING
                5: NOTICE
                6: INFO
                7: DEBUG
                8: NONE
            default: 3

        # Scroll Speed
        OSD_SCROLL_RATE:
            description:
                short: OSD Scroll Rate (ms)
                long: |
                    Scroll rate in milliseconds for OSD messages longer than available character width.
                    This is lower-bounded by the nominal loop rate of this module.
            type: int32
            min: 100
            max: 1000
            default: 125

        # Dwell Time
        OSD_DWELL_TIME:
            description:
                short: OSD Dwell Time (ms)
                long: |
                    Amount of time in milliseconds to dwell at the beginning of the display, when scrolling.
            type: int32
            min: 100
            max: 10000
            default: 500

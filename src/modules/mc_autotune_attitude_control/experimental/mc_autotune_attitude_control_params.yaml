module_name: mc_autotune_attitude_control
parameters:
- group: Autotune
  definitions:
    MC_AT_EN:
      description:
        short: Multicopter autotune module enable
      type: boolean
      default: 0
    MC_AT_SYSID_AMP:
      description:
        short: Relative strength of the injected signal
        long: |-
          Scales the normalized torque excitation. Autotune reduces the
          excitation if the vehicle exceeds the small-motion measurement limit.
      type: float
      default: 0.7
      min: 0.1
      max: 6.0
      decimal: 1
    MC_AT_APPLY:
      description:
        short: Controls when to apply the new gains
        long: |-
          After the auto-tuning sequence is completed,
          a new set of gains is available and can be applied
          immediately or after landing.

          WARNING Applying the gains in air is dangerous as there is no
          guarantee that those new gains will be able to stabilize
          the drone properly.
      type: enum
      values:
        0: Do not apply the new gains (logging only)
        1: Apply the new gains after disarm
        2: WARNING Apply the new gains in air
      default: 1
    MC_AT_RISE_TIME:
      description:
        short: Desired angular rate closed-loop rise time
      type: float
      default: 0.14
      min: 0.01
      max: 2.0
      decimal: 2
      unit: s
    MC_AT_PERIOD:
      description:
        short: Initial response measurement period
        long: |-
          The lowest excitation frequency is the inverse of this period.
          Each axis uses two settling and four measurement periods at each
          of two excitation phases. Autotune can increase the period up to
          128 seconds if low-frequency coverage is insufficient.
      type: float
      default: 8.0
      min: 4.0
      max: 128.0
      unit: s
      decimal: 1
    MC_AT_TIMEOUT:
      description:
        short: Maximum total multicopter autotune duration
        long: |-
          Limits identification and independent response verification together.
          Expiration rejects the candidate and keeps the previous gains.
          Increase this limit when using long periods on slow vehicles.
          Pilot cancellation remains immediate.
      type: float
      default: 600.0
      min: 20.0
      max: 14400.0
      unit: s
      decimal: 0

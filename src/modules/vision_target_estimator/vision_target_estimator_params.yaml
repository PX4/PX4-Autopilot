module_name: vision_target_estimator
parameters:
- group: Vision Target Estimator
  definitions:
    VTE_EN:
      description:
        short: Vision Target Estimator module enable
      type: boolean
      default: 1
      reboot_required: true
    VTE_YAW_EN:
      description:
        short: Vision Target Estimator module enable orientation estimation
      type: boolean
      default: 0
      reboot_required: true
    VTE_POS_EN:
      description:
        short: Vision Target Estimator module enable position estimation
      type: boolean
      default: 1
      reboot_required: true
    VTE_AID_MASK:
      description:
        short: Integer bitmask controlling data fusion and aiding methods
        long: |-
          Absolute target references (bits 0, 3, 5) require vehicle GNSS; their offset from vision is estimated as a bias.
          Bit 0 overrides bits 3 and 5, which are ignored in moving-target builds.
      type: bitmask
      bit:
        0: Target GNSS position (receiver on the target)
        1: UAV GNSS velocity
        2: Vision relative position
        3: Mission land position (precision landing)
        4: Target GNSS velocity (moving-target builds only)
        5: Home position (precision takeoff)
      default: 14
    VTE_TASK_MASK:
      description:
        short: Integer bitmask controlling the tasks of the target estimator
      type: bitmask
      bit:
        0: precision landing
        1: DEBUG, always active
        2: precision takeoff
      default: 1
    VTE_BTOUT:
      description:
        short: Vision target timeout
        long: |-
          Reset after this long without accepted position or yaw updates, tracked separately.
          Velocity updates do not prevent position resets.
      type: float
      default: 3.0
      unit: s
      min: 0.1
      max: 50
      decimal: 1
      increment: 0.5
    VTE_TGT_TOUT:
      description:
        short: Target validity timeout
        long: |-
          Maximum time without accepted position or yaw updates before that estimate becomes invalid.
          Keep below VTE_BTOUT.
      type: float
      default: 2.0
      unit: s
      min: 0.1
      max: 50
      decimal: 2
      increment: 0.25
    VTE_M_REC_TOUT:
      description:
        short: Measurement recent timeout
        long: Maximum raw measurement age allowed for fusion.
      type: float
      default: 1.0
      unit: s
      min: 0.1
      max: 10
      decimal: 2
      increment: 0.05
    VTE_M_UPD_TOUT:
      description:
        short: Measurement updated timeout
        long: Maximum age of local position, velocity and antenna-offset corrections. GNSS-to-vision alignment may span the measurement recent timeout.
      type: float
      default: 0.1
      unit: s
      min: 0.01
      max: 5
      decimal: 3
      increment: 0.01
    VTE_ACC_D_UNC:
      description:
        short: UAV acceleration white-noise power spectral density
        long: |-
          UAV velocity variance growth rate from acceleration noise (m^2/s^3), independent of update rate.
          Higher values follow measurements faster and reject fewer outliers.
      type: float
      default: 0.02
      min: 0.0001
      decimal: 4
    VTE_ACC_T_UNC:
      description:
        short: Target acceleration random-walk process noise
        long: |-
          Target acceleration variance growth rate (m^2/s^5), independent of update rate. Moving-target builds only.
          Higher values track manoeuvres faster and reject fewer outliers.
      type: float
      default: 0.1
      min: 0.01
      decimal: 2
    VTE_BIAS_UNC:
      description:
        short: Bias random-walk process noise
        long: |-
          GNSS/vision position-bias variance growth rate (m^2/s), independent of update rate.
          Higher values track reference drift faster; lower values keep the bias steadier.
      type: float
      default: 0.001
      min: 0.0001
      decimal: 4
    VTE_POS_UNC_IN:
      description:
        short: Initial target and drone relative position uncertainty
        long: |-
          Minimum initial variance of the relative target position in x, y, and z direction.
          The variance reported by the initializing observation is used if it is larger.
          Applied at initialization/reset and GNSS/vision bias activation.
      type: float
      default: 0.5
      unit: m^2
      min: 0.001
      decimal: 3
    VTE_VEL_UNC_IN:
      description:
        short: Initial target and drone relative velocity uncertainty
        long: |-
          Initial velocity variance per axis, applied separately to the UAV and moving target.
          Changes apply at initialization/reset.
      type: float
      default: 0.5
      unit: (m/s)^2
      min: 0.001
      decimal: 3
    VTE_BIA_UNC_IN:
      description:
        short: Initial GPS bias uncertainty
        long: |-
          Initial GNSS/vision position-bias variance per axis. Higher values allow larger initial bias corrections.
          Applied at initialization/reset and bias activation. Use VTE_BIAS_UNC for ongoing drift.
      type: float
      default: 1.0
      unit: m^2
      min: 0.001
      decimal: 3
    VTE_BIA_AVG_THR:
      description:
        short: Initial GNSS/vision bias averaging threshold
        long: |-
          Maximum 3D difference between raw and filtered bias to finish averaging after GNSS-first startup.
          Lower values require steadier samples. Requires 5 consecutive matches and at least 0.6 s, or VTE_BIA_AVG_TOUT.
          Set to 0 to disable averaging.
      type: float
      default: 0.3
      unit: m
      min: 0.0
      decimal: 2
    VTE_BIA_AVG_TOUT:
      description:
        short: Initial GNSS/vision bias averaging timeout
        long: |-
          Maximum time to average the GNSS/vision bias when starting from GNSS position. Vision fusion waits meanwhile.
          If GNSS expires, switch to vision with the filtered bias. Set to 0 to disable averaging.
      type: float
      default: 1.0
      unit: s
      min: 0.0
      decimal: 2
    VTE_YAW_UNC_IN:
      description:
        short: Initial orientation uncertainty
        long: |-
          Initial yaw variance (rad^2); also used for yaw-rate variance ((rad/s)^2).
          Changes apply at initialization/reset.
      type: float
      default: 1.0
      min: 0.001
      decimal: 3
    VTE_YAW_ACC_UNC:
      description:
        short: Yaw acceleration white-noise power spectral density
        long: |-
          Yaw-rate variance growth rate from acceleration noise (rad^2/s^3), independent of update rate.
          Higher values track heading changes faster; lower values smooth yaw more.
      type: float
      default: 0.004
      min: 0.0
      decimal: 4
    VTE_ACC_UNC_IN:
      description:
        short: Initial target absolute acceleration uncertainty
        long: |-
          Initial absolute target-acceleration variance per axis (moving-target builds only).
          Changes apply at initialization/reset. Use VTE_ACC_T_UNC for ongoing manoeuvre tracking.
      type: float
      default: 0.1
      unit: (m/s^2)^2
      min: 0.001
      decimal: 3
    VTE_GPS_V_NOISE:
      description:
        short: Minimum standard deviation for GPS velocity observations
        long: |-
          Minimum GNSS velocity noise; used only when reported noise is lower.
          Increase to reduce trust in velocity measurements.
      type: float
      default: 0.3
      unit: m/s
      min: 0.01
      max: 5.0
      decimal: 2
    VTE_GPS_P_NOISE:
      description:
        short: Minimum standard deviation for GPS position observations
        long: |-
          Minimum GNSS position noise for target, mission or home aiding; used only when reported noise is lower.
          Increase to reduce trust in position measurements.
      type: float
      default: 0.5
      unit: m
      min: 0.01
      max: 10.0
      decimal: 2
    VTE_EVA_NOISE:
      description:
        short: Minimum standard deviation for vision yaw observations
        long: |-
          Minimum vision yaw noise; used only when reported noise is lower. Default: about 4 deg.
          Lower values increase trust in yaw measurements and can cause control oscillations.
      type: float
      default: 0.07
      min: 0.05
      unit: rad
      decimal: 2
    VTE_EVP_NOISE:
      description:
        short: Minimum standard deviation for vision relative-position observations
        long: |-
          Minimum vision position noise; used only when reported noise is lower.
          Increase to reduce trust in position measurements.
      type: float
      default: 0.1
      min: 0.01
      unit: m
      decimal: 2
    VTE_POS_NIS_THRE:
      description:
        short: Normalized innovation squared threshold for the position estimator
        long: |-
          Per-axis outlier gate for position and velocity measurements. Lower values reject more samples.
          For Gaussian innovations, 3.84 rejects about 5% of valid samples; 6.63 rejects 1%.
      type: float
      default: 3.84
      min: 0.46
      max: 10.83
      decimal: 2
    VTE_YAW_NIS_THRE:
      description:
        short: Normalized innovation squared threshold for the orientation estimator
        long: |-
          Yaw outlier gate. Lower values reject more samples.
          For Gaussian innovations, 3.84 rejects about 5% of valid samples; 6.63 rejects 1%.
      type: float
      default: 3.84
      min: 0.46
      max: 10.83
      decimal: 2

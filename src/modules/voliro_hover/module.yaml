module_name: Voliro Hover

parameters:
    - group: Voliro Hover
      definitions:
        VHOV_EN:
            description:
                short: Enable onboard Voliro Hover mode at boot
                long: Requires reboot. Also requires VOLA_EN and VCTRL_EN.
            type: boolean
            default: false
            reboot_required: true
        VHOV_ALT:
            description:
                short: Hover height above captured takeoff point
            type: float
            unit: m
            min: 0.1
            max: 5
            default: 0.5
        VHOV_LCH_ACC:
            description:
                short: Upward acceleration feed-forward before liftoff
                long: Applied only while the land detector still reports landed. The bounded launch phase ends at liftoff or VHOV_LCH_TMO.
            type: float
            unit: m/s^2
            min: 0.1
            max: 3
            default: 0.8
        VHOV_LCH_TMO:
            description:
                short: Maximum launch-phase duration
                long: Returns to ground hold if the land detector does not confirm liftoff in this time.
            type: float
            unit: s
            min: 0.2
            max: 5
            default: 2
        VHOV_TD_ACC:
            description:
                short: Downward acceleration feed-forward after descent
                long: Unloads the motors after the controlled profile reaches captured ground so PX4 can confirm landed and auto-disarm.
            type: float
            unit: m/s^2
            min: 0.1
            max: 9.81
            default: 9.81
        VHOV_TKO_T:
            description:
                short: Minimum-jerk takeoff duration
            type: float
            unit: s
            min: 1
            max: 30
            default: 5
        VHOV_LND_T:
            description:
                short: Minimum-jerk landing duration
            type: float
            unit: s
            min: 1
            max: 30
            default: 5
        VHOV_ODOM_TMO:
            description:
                short: Maximum estimator odometry age
            type: float
            unit: s
            min: 0.02
            max: 1
            default: 0.15
        VHOV_FB_TMO:
            description:
                short: Maximum GL40II feedback age
            type: float
            unit: s
            min: 0.02
            max: 1
            default: 0.15
        VHOV_ZERO_TOL:
            description:
                short: Maximum centered tilt error for mode entry
                long: Applied to each measured joint angle while landed and before mode entry.
            type: float
            unit: rad
            min: 0.01
            max: 0.7854
            default: 0.174533

module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_DRAG_CTRL:
      description:
        short: Multirotor wind estimation selection
        long: Uses specific-force measurements with drag model (EKF2_BCOEF_[XY],
          EKF2_MCOEF). Only for Z-aligned thrust vehicles with no XY thrust.
      type: boolean
      default: 0
    EKF2_DRAG_NOISE:
      description:
        short: Specific drag force observation noise variance
        long: Used by the multi-rotor drag model. Higher values slow wind estimate
          adjustment.
      type: float
      default: 2.5
      min: 0.5
      max: 10.0
      unit: (m/s^2)^2
      decimal: 2
    EKF2_BCOEF_X:
      description:
        short: X-axis ballistic coefficient used for multi-rotor wind estimation
        long: Bluff body drag along the forward/reverse axis, which scales with speed squared.
          Rotor drag is set by EKF2_MCOEF. Only used when EKF2_DRAG_CTRL is enabled.
          Set to 0 to disable for this axis.
      type: float
      default: 100.0
      min: 0.0
      max: 200.0
      unit: kg/m^2
      decimal: 1
    EKF2_BCOEF_Y:
      description:
        short: Y-axis ballistic coefficient used for multi-rotor wind estimation
        long: Bluff body drag along the right/left axis, which scales with speed squared.
          Rotor drag is set by EKF2_MCOEF. Only used when EKF2_DRAG_CTRL is enabled.
          Set to 0 to disable for this axis.
      type: float
      default: 100.0
      min: 0.0
      max: 200.0
      unit: kg/m^2
      decimal: 1
    EKF2_MCOEF:
      description:
        short: Propeller momentum drag coefficient for multi-rotor wind estimation
        long: Propeller momentum drag, which scales with speed, not speed squared. For
          unducted propellers of equal diameter, roughly proportional to blade area seen
          side-on; much higher for ducted rotors. Body drag is set by EKF2_BCOEF_X and
          EKF2_BCOEF_Y. Only used when EKF2_DRAG_CTRL is enabled. Set to 0 to disable
          for both axes.
      type: float
      default: 0.15
      min: 0
      max: 1.0
      unit: 1/s
      decimal: 2

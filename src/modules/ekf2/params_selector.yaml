module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_SEL_ERR_RED:
      description:
        short: Selector error reduce threshold
        long: EKF2 instances have to be better than the selected by at least this
          amount before their relative score can be reduced.
      type: float
      default: 0.2
    EKF2_SEL_IMU_RAT:
      description:
        short: Selector angular rate threshold
        long: Angular rate difference between a gyro and the mean of the other gyros
          above which angular error accumulates.
      type: float
      default: 10.5
      unit: deg/s
    EKF2_SEL_IMU_ANG:
      description:
        short: Selector angular threshold
        long: EKF2 selector maximum accumulated angular error threshold for comparing
          gyros. Accumulated angular error larger than this will result in the sensor
          being declared faulty.
      type: float
      default: 22.5
      unit: deg
    EKF2_SEL_IMU_ACC:
      description:
        short: Selector acceleration threshold
        long: Acceleration difference between an accelerometer and the mean of the
          other accelerometers above which velocity error accumulates.
      type: float
      default: 1.5
      unit: m/s^2
    EKF2_SEL_IMU_VEL:
      description:
        short: Selector velocity threshold
        long: EKF2 selector maximum accumulated velocity threshold for comparing accelerometers.
          Accumulated velocity error larger than this will result in the sensor being
          declared faulty.
      type: float
      default: 3.0
      unit: m/s

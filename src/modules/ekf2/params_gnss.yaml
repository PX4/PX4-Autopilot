module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_GPS_CTRL:
      description:
        short: GNSS sensor aiding
        long: 'Set bits in the following positions to enable: 0 : Longitude and latitude
          fusion 1 : Altitude fusion 2 : 3D velocity fusion 3 : Dual antenna heading
          fusion'
      type: bitmask
      bit:
        0: Lon/lat
        1: Altitude
        2: 3D velocity
        3: Dual antenna heading
      default: 7
      min: 0
      max: 15
    EKF2_GPS_MODE:
      description:
        short: Fusion reset mode
        long: 'Automatic: reset on fusion timeout if no other source of position is available.
          Dead-reckoning: reset on fusion timeout if no source of velocity is available.'
      type: enum
      values:
        0: Automatic
        1: Dead-reckoning
      default: 0
    EKF2_GPS_P_NOISE:
      description:
        short: Measurement noise for GNSS position
      type: float
      default: 0.5
      min: 0.01
      max: 10.0
      unit: m
      decimal: 2
    EKF2_GPS_P_GATE:
      description:
        short: Gate size for GNSS position fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_GPS_V_GATE:
      description:
        short: Gate size for GNSS velocity fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_GPS_V_NOISE:
      description:
        short: Measurement noise for GNSS velocity
      type: float
      default: 0.3
      min: 0.01
      max: 5.0
      unit: m/s
      decimal: 2
    EKF2_GSF_TAS:
      description:
        short: Default value of true airspeed used in EKF-GSF AHRS calculation
        long: If no airspeed measurements are available, the EKF-GSF AHRS calculation
          will assume this value of true airspeed when compensating for centripetal
          acceleration during turns. Set to zero to disable centripetal acceleration
          compensation during fixed wing flight modes.
      type: float
      default: 15.0
      min: 0.0
      unit: m/s
      max: 100.0
      decimal: 1
    EKF2_REQ_GPS_H:
      description:
        short: GNSS fusion restart and heading reset wait
        long: After EKF2 stops GNSS velocity and position fusion, it restarts it only
          after this time while disarmed on the ground, and after a tenth of it, at
          least 1 s, otherwise. After a GNSS heading failure, a yaw reset to the GNSS
          heading also waits this long. The GNSS checks use GNSS_REQ_TIME.
      type: float
      default: 10.0
      min: 0.1
      decimal: 1
      unit: s
    EKF2_REQ_SACC:
      description:
        short: GNSS speed accuracy for vertical velocity and yaw estimator
        long: Below this speed accuracy EKF2 trusts the GNSS vertical velocity while the
          accelerometer clips, and feeds the GNSS velocity to the EKF-GSF yaw estimator.
          The GNSS checks use GNSS_REQ_SACC.
      type: float
      default: 0.5
      min: 0.5
      max: 5.0
      unit: m/s
      decimal: 2

__max_num_ranging_beacons: &max_num_ranging_beacons 4

module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_RNGBC_CTRL:
      description:
        short: Ranging beacon fusion control
        long: Enable/disable ranging beacon fusion.
      type: enum
      values:
        0: Disable ranging beacon fusion
        1: Enable ranging beacon fusion
      default: 0
    EKF2_RNGBC_DELAY:
      description:
        short: Ranging beacon measurement delay relative to IMU measurements
      type: float
      default: 0
      min: 0
      max: 1000
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_RNGBC_GATE:
      description:
        short: Gate size for ranging beacon fusion
        long: Sets the number of standard deviations used by the innovation consistency test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_RNGBC_NOISE:
      description:
        short: Measurement noise for ranging beacon fusion
        long: Used to lower bound or replace the uncertainty included in the message
      type: float
      default: 30.0
      min: 0.1
      max: 500.0
      unit: m
      decimal: 1
- group: RangingBeacon
  definitions:
    RNGBC_${i}_ID:
      description:
        short: Ranging beacon ${i} ID
        long: |-
          ID of the beacon whose position is taken from RNGBC_${i}_LAT/LON/AMSL instead of the
          RANGING_BEACON message. Set to -1 to disable this slot.
      type: int32
      default: -1
      min: -1
      max: 65535
      num_instances: *max_num_ranging_beacons
      instance_start: 1
    RNGBC_${i}_LAT:
      description:
        short: Ranging beacon ${i} latitude (deg * 1e7)
        long: |-
          Ranging beacon ${i} latitude in degrees multiplied by 1e7.
      type: int32
      default: 0
      unit: deg*1e7
      min: -900000000
      max: 900000000
      num_instances: *max_num_ranging_beacons
      instance_start: 1
    RNGBC_${i}_LON:
      description:
        short: Ranging beacon ${i} longitude (deg * 1e7)
        long: |-
          Ranging beacon ${i} longitude in degrees multiplied by 1e7.
      type: int32
      default: 0
      unit: deg*1e7
      min: -1800000000
      max: 1800000000
      num_instances: *max_num_ranging_beacons
      instance_start: 1
    RNGBC_${i}_AMSL:
      description:
        short: Ranging beacon ${i} altitude (m AMSL)
        long: |-
          Ranging beacon ${i} altitude in meters above mean sea level.
      type: float
      default: 0.0
      unit: m
      num_instances: *max_num_ranging_beacons
      instance_start: 1

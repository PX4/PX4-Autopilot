module_name: launchdetection
parameters:
- group: FW Auto Takeoff
  definitions:
    FW_LAUN_DETCN_ON:
      description:
        short: Fixed-wing launch detection
        long: |-
          Enables automatic launch detection based on measured acceleration. Use for hand- or catapult-launched vehicles.
          Launch detection runs in every flight mode, not only in Takeoff mode: while it waits for a launch the vehicle
          is held in the landed state, so that handling it on the launcher cannot be mistaken for a takeoff.
          Has no effect while runway takeoff (RWTO_TKOFF) is enabled, as the two are alternatives and a takeoff
          rolling down a runway never produces the acceleration this waits for.
      type: boolean
      default: 0
    FW_LAUN_AC_THLD:
      description:
        short: Trigger acceleration threshold
        long: Launch is detected when the norm of body acceleration
          is above FW_LAUN_AC_THLD for FW_LAUN_AC_T seconds.
      type: float
      default: 30.0
      unit: m/s^2
      min: 0
      decimal: 1
      increment: 0.5
    FW_LAUN_AC_T:
      description:
        short: Trigger time
        long: Launch is detected when the norm of body acceleration
          is above FW_LAUN_AC_THLD for FW_LAUN_AC_T seconds.
      type: float
      default: 0.05
      unit: s
      min: 0.0
      max: 5.0
      decimal: 2
      increment: 0.05

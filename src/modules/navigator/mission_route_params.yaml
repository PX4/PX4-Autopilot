module_name: navigator
parameters:
- group: Mission
  definitions:
    MIS_ROUTE_JOIN:
      description:
        short: Rejoin the mission route when Mission starts or resumes in flight
        long: |-
          If enabled, starting or resuming Mission in flight joins the uploaded route
          at a projected branch-in point, also on the first start after an upload and
          after a landing. If disabled, Mission resumes as without the join. Only
          multicopters join; other vehicles resume as without the join.
      type: boolean
      default: 0
    MIS_MC_SEG_DIST:
      description:
        short: Extra cross-track search distance for multicopter route projections
        long: |-
          When projecting the vehicle onto the uploaded mission route for Mission resume
          (MIS_ROUTE_JOIN), keep candidates whose cross-track distance is at most this
          much larger than the closest one.
      type: float
      default: 30.0
      unit: m
      min: 0
      decimal: 1
      increment: 1

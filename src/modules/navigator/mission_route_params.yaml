module_name: navigator
parameters:
- group: Mission
  definitions:
    MIS_ROUTE_JOIN:
      description:
        short: Rejoin the mission route when Mission starts or resumes in flight
        long: |-
          If enabled, starting or resuming Mission in flight joins the uploaded route
          at a projected branch-in point, also on the first start after an upload and
          after a landing. If disabled, Mission resumes as without the join.
          Multicopters, fixed-wings and VTOLs join; other vehicles resume as without
          the join.
      type: boolean
      default: 0
    MIS_MC_SEG_DIST:
      description:
        short: Extra cross-track search distance for multicopter route projections
        long: |-
          When projecting the vehicle onto the uploaded mission route for Mission resume
          (MIS_ROUTE_JOIN) or RTL_TYPE = 7, keep candidates whose cross-track distance is
          at most this much larger than the closest one.
      type: float
      default: 30.0
      unit: m
      min: 0
      decimal: 1
      increment: 1
    MIS_FW_SEG_DIST:
      description:
        short: Extra cross-track search distance for fixed-wing route projections
        long: |-
          When projecting the vehicle onto the uploaded mission route for Mission resume
          (MIS_ROUTE_JOIN) or RTL_TYPE = 7, keep candidates whose cross-track distance is
          at most this much larger than the closest one.
      type: float
      default: 150.0
      unit: m
      min: 0
      decimal: 1
      increment: 1
- group: Return Mode
  definitions:
    RTL_RP_SEG_DIST:
      description:
        short: Extra cross-track search distance for rally point route projections
        long: |-
          When projecting a rally point onto the uploaded mission route for RTL_TYPE = 7,
          keep candidates whose cross-track distance is at most this much larger than the
          closest one.
      type: float
      default: 30.0
      unit: m
      min: 0
      decimal: 1
      increment: 1
    RTL_FW_UTURN_PEN:
      description:
        short: Fixed-wing U-turn distance penalty
        long: |-
          Virtual distance added when RTL_TYPE = 7 would require a fixed-wing
          vehicle to reverse direction on the mission route.
      type: float
      default: 4000.0
      unit: m
      min: 0
      decimal: 1
      increment: 100

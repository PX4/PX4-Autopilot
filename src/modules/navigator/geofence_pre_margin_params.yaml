module_name: navigator
parameters:
- group: Geofence
  definitions:
    GF_PRE_MARGIN:
      description:
        short: Pre-geofence horizontal margin to the geofence
        long: Triggers GF_PRE_ACTION within this distance of GF_MAX_HOR_DIST, or of a polygon or circle
          of the geofence plan. Disabled if 0.
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 10000
      decimal: 0
      increment: 10

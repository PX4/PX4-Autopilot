module_name: navigator
parameters:
- group: Geofence
  definitions:
    GF_ACTION:
      description:
        short: Geofence breach action
        long: |-
          Note: Setting this value to 4 enables flight termination,
          which will kill the vehicle on a breach of the fence.
      type: enum
      values:
        0: None
        1: Warning
        2: Hold mode
        3: Return mode
        4: Terminate
        5: Land mode
      default: 2
      min: 0
      max: 5
    GF_SOURCE:
      description:
        short: Geofence source
        long: |-
          Select which position source should be used. Selecting GPS instead of global position makes sure that there is
          no dependence on the position estimator
          0 = global position, 1 = GPS
      type: enum
      values:
        0: GPOS
        1: GPS
      default: 0
      min: 0
      max: 1
    GF_MAX_HOR_DIST:
      description:
        short: Max horizontal distance from Home
        long: Triggers GF_ACTION beyond this distance. Disabled if 0.
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 10000
      increment: 1
    GF_MAX_VER_DIST:
      description:
        short: Max vertical distance from Home
        long: Triggers GF_ACTION above this height over Home. Disabled if 0.
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 10000
      increment: 1
    GF_CONT_ACTION:
      description:
        short: Contingency geofence breach action
        long: If the geofence is breached as well, the more severe of the two actions is taken.
      type: enum
      values:
        1: Warning
        2: Hold mode
        3: Return mode
        5: Land mode
      default: 2
      min: 1
      max: 5

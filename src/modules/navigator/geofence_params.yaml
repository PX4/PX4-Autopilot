module_name: navigator
parameters:
- group: Geofence
  definitions:
    GF_ACTION:
      description:
        short: Geofence violation action
        long: |-
          Note: Setting this value to 4 enables flight termination,
          which will kill the vehicle on violation of the fence.
      type: enum
      values:
        0: None
        1: Warning
        2: Hold mode
        3: Return mode
        4: Terminate
        5: Land mode
      default: 2
      min: 0
      max: 5
    GF_SOURCE:
      description:
        short: Geofence source
        long: |-
          Select which position source should be used. Selecting GPS instead of global position makes sure that there is
          no dependence on the position estimator
          0 = global position, 1 = GPS
      type: enum
      values:
        0: GPOS
        1: GPS
      default: 0
      min: 0
      max: 1
    GF_MAX_HOR_DIST:
      description:
        short: Max horizontal distance from Home
        long: |-
          Maximum horizontal distance in meters the vehicle can be from Home before triggering a geofence action.
          Disabled if 0.
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 10000
      increment: 1
    GF_MAX_VER_DIST:
      description:
        short: Max vertical distance from Home
        long: |-
          Maximum vertical distance in meters the vehicle can be from Home before triggering a geofence action.
          Disabled if 0.
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 10000
      increment: 1
    GF_PRE_MARGIN:
      description:
        short: Pre-geofence margin
        long: The vehicle breaches the pre-geofence once it comes closer than this distance to a horizontal
          fence (polygon, circle or GF_MAX_HOR_DIST), which triggers GF_PRE_ACT. Uploaded missions and
          commanded positions must keep the margin, and arming is denied within it. Set to 0 to disable.
          Has no effect on boards built without geofence path checks, e.g. fmu-v2.
      type: float
      default: 0.0
      unit: m
      min: 0
      max: 10000
      decimal: 0
      increment: 10
    GF_PRE_ACT:
      description:
        short: Pre-geofence violation action
        long: Only used when GF_PRE_MARGIN is enabled. GF_ACTION takes precedence once the geofence itself is
          breached.
      type: enum
      values:
        0: None
        1: Warning
        2: Hold mode
        3: Return mode
        4: Terminate
        5: Land mode
      default: 2
      min: 0
      max: 5

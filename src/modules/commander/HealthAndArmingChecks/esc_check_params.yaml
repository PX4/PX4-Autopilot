module_name: HealthAndArmingChecks
parameters:
- group: Motor Failure
  definitions:
    FD_ACT_EN:
      description:
        short: Enable Actuator Failure check
        long: |-
          If enabled, the HealthAndArmingChecks will verify that for motors, a minimum amount of ESC current per throttle
          level is being consumed.
          Otherwise this indicates an motor failure.
          This check only works for ESCs that report current consumption.
      type: boolean
      default: 0
    MOTFAIL_C2T:
      description:
        short: Motor Failure Current/Throttle Scale
        long: |-
          Determines the slope between expected steady state current and linearized, normalized thrust command [0, 1].
          The value is the expected steady state current in A at 100% thrust.
          MOTFAIL_OFF offsets the under- and over-current thresholds from that slope.
      type: float
      default: 35.0
      min: 0.0
      max: 50.0
      unit: A
      decimal: 2
      increment: 1
    MOTFAIL_OFF:
      description:
        short: Under/over-current motor failure limit offset
        long: The check triggers when the ESC current is below `MOTFAIL_C2T * thrust - MOTFAIL_OFF` or above `MOTFAIL_C2T * thrust + MOTFAIL_OFF`.
      type: float
      default: 10.0
      min: 0
      max: 30
      unit: A
      decimal: 2
      increment: 1
    MOTFAIL_TIME:
      description:
        short: Motor Failure Hysteresis Time
        long: Motor failure only triggers after current thresholds are exceeded for
          this time.
      type: float
      default: 1.0
      unit: s
      min: 0.01
      max: 10
      decimal: 2
      increment: 1
- group: ESC
  definitions:
    ESC_TEMP_WARN_TH:
      description:
        short: ESC temperature warning threshold
        long: |-
          Warning only, no failsafe or arming blocked.
          -1 disables the check.
      type: float
      default: 90.0
      min: -1
      max: 150
      unit: celcius
      decimal: 1
      increment: 1

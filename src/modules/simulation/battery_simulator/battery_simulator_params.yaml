module_name: battery_simulator
parameters:
- group: SITL
  definitions:
    SIM_BAT_I_FW:
      description:
        short: Simulated battery average current draw in fixed wing
        long: |-
          Average current drawn from simulated battery by the drone in fixed wing mode while armed. The battery simulator only starts if SIM_BAT_I_FW or SIM_BAT_I_MC is greater than 0. Set both to 0 to disable it entirely (useful when battery state is provided externally, e.g. via MAVLink).
      type: float
      default: 2.0
      min: 0.0
      unit: A
    SIM_BAT_I_MC:
      description:
        short: Simulated battery average current draw in rotor wing
        long: |-
          Average current drawn from simulated battery by the drone in rotor wing mode, or any vehicle type other than fixed wing, while armed. The battery simulator only starts if SIM_BAT_I_FW or SIM_BAT_I_MC is greater than 0. Set both to 0 to disable it entirely (useful when battery state is provided externally, e.g. via MAVLink).
      type: float
      default: 8.0
      min: 0.0
      unit: A
    SIM_BAT${i}_I_FW:
      description:
        short: Simulated battery ${i} average current draw in fixed wing
        long: |-
          Average current drawn from simulated battery ${i} by the drone in fixed wing mode while armed. Set to -1 to use SIM_BAT_I_FW
      type: float
      default: [-1.0, -1.0, -1.0]
      min: -1
      unit: A
      num_instances: 3
      instance_start: 1
    SIM_BAT${i}_I_MC:
      description:
        short: Simulated battery ${i} average current draw in rotor wing
        long: |-
          Average current drawn from simulated battery ${i} by the drone in rotor wing mode, or any vehicle type other than fixed wing, while armed. Set to -1 to use SIM_BAT_I_MC
      type: float
      default: [-1.0, -1.0, -1.0]
      min: -1
      unit: A
      num_instances: 3
      instance_start: 1
    SIM_BAT_MIN_PCT:
      description:
        short: Simulator Battery minimal percentage
        long: |-
          Can be used to alter the battery level during SITL- or HITL-simulation on the fly.
          Particularly useful for testing different low-battery behaviour.
      type: float
      default: 50.0
      min: 0
      max: 100
      increment: 0.1
      unit: '%'
    SIM_BAT${i}_MIN_PCT:
      description:
        short: Simulated battery ${i} minimal percentage
        long: |-
          Lowest state of charge simulated battery ${i} drains down to, overriding
          SIM_BAT_MIN_PCT for this battery only. Set to -1 to use SIM_BAT_MIN_PCT.
          Only has an effect if battery ${i} is enabled through BAT${i}_SOURCE.
      type: float
      default: [-1.0, -1.0, -1.0]
      min: -1
      max: 100
      increment: 0.1
      unit: '%'
      num_instances: 3
      instance_start: 1

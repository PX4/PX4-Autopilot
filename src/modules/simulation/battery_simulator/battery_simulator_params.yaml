module_name: battery_simulator
parameters:
- group: SITL
  definitions:
    SIM_BAT_DRAIN:
      description:
        short: Simulated battery full-discharge time
        long: |-
          Time in seconds for the simulated battery to drain from 100% to 0% while armed. Set to 0 to disable the battery simulator entirely (useful when battery state is provided externally, e.g. via MAVLink).
      type: float
      default: 60
      min: 0
      increment: 1
      unit: s
    SIM_BAT${i}_DRAIN:
      description:
        short: Simulated battery ${i} full-discharge time
        long: |-
          Time in seconds for simulated battery ${i} to drain from 100% to 0% while armed,
          overriding SIM_BAT_DRAIN for this battery only. A non-positive value uses SIM_BAT_DRAIN.
          Only has an effect if battery ${i} is enabled through BAT${i}_SOURCE.
      type: float
      default: [-1.0, -1.0, -1.0]
      min: -1
      increment: 1
      unit: s
      num_instances: 3
      instance_start: 1
    SIM_BAT_I_MOT:
      description:
        short: Simulated motor current at full output
        long: |-
          Current a simulated motor draws at full output. Simulators that model the ESC current
          (SIH) report it in the ESC status, and the simulated batteries share the sum of the ESC
          currents plus SIM_BAT_I_IDLE evenly. Set to 0 for no current measurement.
      type: float
      default: 0.0
      min: 0.0
      max: 200.0
      increment: 0.5
      decimal: 1
      unit: A
    SIM_BAT_I_IDLE:
      description:
        short: Simulated current without the motors
        long: |-
          Current drawn by everything other than the motors, e.g. avionics and payload.
          Only used with SIM_BAT_I_MOT set.
      type: float
      default: 0.5
      min: 0.0
      max: 50.0
      increment: 0.1
      decimal: 1
      unit: A
    SIM_BAT_MIN_PCT:
      description:
        short: Simulator Battery minimal percentage
        long: |-
          Can be used to alter the battery level during SITL- or HITL-simulation on the fly.
          Particularly useful for testing different low-battery behaviour.
      type: float
      default: 50.0
      min: 0
      max: 100
      increment: 0.1
      unit: '%'
    SIM_BAT${i}_MIN_PCT:
      description:
        short: Simulated battery ${i} minimal percentage
        long: |-
          Lowest state of charge simulated battery ${i} drains down to, overriding
          SIM_BAT_MIN_PCT for this battery only. Set to -1 to use SIM_BAT_MIN_PCT.
          Only has an effect if battery ${i} is enabled through BAT${i}_SOURCE.
      type: float
      default: [-1.0, -1.0, -1.0]
      min: -1
      max: 100
      increment: 0.1
      unit: '%'
      num_instances: 3
      instance_start: 1

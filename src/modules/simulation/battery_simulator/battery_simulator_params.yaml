module_name: battery_simulator
parameters:
- group: SITL
  definitions:
    SIM_BAT_I_IDLE:
      description:
        short: Simulated battery current draw with motors stopped
        long: |-
          Current drawn from each simulated battery while armed by everything other than the motors, e.g. avionics and payload. This is also the only current drawn while no motor commands are available. With several batteries enabled, each one is drained by this full current.
          The battery simulator only starts if SIM_BAT_I_IDLE or SIM_BAT_I_MOT is greater than 0. Set both to 0 to disable it entirely (useful when battery state is provided externally, e.g. via MAVLink).
      type: float
      default: 0.5
      min: 0.0
      unit: A
    SIM_BAT_I_MOT:
      description:
        short: Simulated battery current draw per motor at full throttle
        long: |-
          Current drawn from each simulated battery by a single motor at full thrust. Each motor draws this current scaled by its normalized thrust command to the power of 1.5 (momentum theory). With several batteries enabled, each one is drained by this full current.
          With the default SIM_BAT_I_IDLE, the default draws about 8 A for a quadcopter hovering at 60% thrust.
          The battery simulator only starts if SIM_BAT_I_IDLE or SIM_BAT_I_MOT is greater than 0. Set both to 0 to disable it entirely (useful when battery state is provided externally, e.g. via MAVLink).
      type: float
      default: 4.0
      min: 0.0
      unit: A
    SIM_BAT${i}_I_IDLE:
      description:
        short: Simulated battery ${i} current draw with motors stopped
        long: |-
          Current drawn from simulated battery ${i} while armed by everything other than the motors. Set to -1 to use SIM_BAT_I_IDLE.
          Only has an effect if battery ${i} is enabled through BAT${i}_SOURCE.
      type: float
      default: [-1.0, -1.0, -1.0]
      min: -1
      unit: A
      num_instances: 3
      instance_start: 1
    SIM_BAT${i}_I_MOT:
      description:
        short: Simulated battery ${i} current draw per motor at full throttle
        long: |-
          Current drawn from simulated battery ${i} by a single motor at full thrust. Set to -1 to use SIM_BAT_I_MOT.
          Only has an effect if battery ${i} is enabled through BAT${i}_SOURCE.
      type: float
      default: [-1.0, -1.0, -1.0]
      min: -1
      unit: A
      num_instances: 3
      instance_start: 1
    SIM_BAT_MIN_PCT:
      description:
        short: Simulator Battery minimal percentage
        long: |-
          Can be used to alter the battery level during SITL- or HITL-simulation on the fly.
          Particularly useful for testing different low-battery behaviour.
      type: float
      default: 50.0
      min: 0
      max: 100
      increment: 0.1
      unit: '%'
    SIM_BAT${i}_MIN_PCT:
      description:
        short: Simulated battery ${i} minimal percentage
        long: |-
          Lowest state of charge simulated battery ${i} drains down to, overriding
          SIM_BAT_MIN_PCT for this battery only. Set to -1 to use SIM_BAT_MIN_PCT.
          Only has an effect if battery ${i} is enabled through BAT${i}_SOURCE.
      type: float
      default: [-1.0, -1.0, -1.0]
      min: -1
      max: 100
      increment: 0.1
      unit: '%'
      num_instances: 3
      instance_start: 1

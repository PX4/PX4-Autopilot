__max_num_motors: &max_num_motors 16
__max_num_servos: &max_num_servos 8
__max_num_tilts: &max_num_tilts 4

module_name: SIM_GZ
actuator_output:
  show_subgroups_if: 'SIM_GZ_EN>=1'
  config_parameters:
    - param: 'SIM_GZ_EN'
      label: 'Configure'
      function: 'enable'

  output_groups:
    - param_prefix: SIM_GZ_EC
      group_label: 'ESCs'
      channel_label: 'ESC'
      standard_params:
        disarmed: { min: 0, max: 1000, default: 0 }
        min: { min: 0, max: 1000, default: 0 }
        max: { min: 0, max: 1000, default: 1000 }
        failsafe: { min: 0, max: 1000 }
      custom_params:
        - name: 'BIDI'
          label: 'Bidirectional'
          index_offset: -1
          show_as: bitset
      num_channels: *max_num_motors
    - param_prefix: SIM_GZ_SV
      group_label: 'Servos'
      channel_label: 'Servo'
      standard_params:
        disarmed: { min: 0, max: 1000, default: 500 }
        min: { min: 0, max: 1000, default: 0 }
        max: { min: 0, max: 1000, default: 1000 }
        failsafe: { min: 0, max: 1000 }
      num_channels: *max_num_servos
    - param_prefix: SIM_GZ_WH
      group_label: 'Wheels'
      channel_label: 'Wheels'
      standard_params:
        disarmed: { min: 0, max: 200, default: 100 }
        min: { min: 0, max: 200, default: 0 }
        max: { min: 0, max: 200, default: 200 }
        failsafe: { min: 0, max: 200 }
      num_channels: 4

parameters:
    - group: Geometry
      definitions:
        SIM_GZ_SV_MAXA${i}:
            description:
                short: Servo ${i} Angle at Maximum
                long: |
                  Defines the angle when the servo is at the maximum.
                  Currently only supported in gz simulation and must be coherent with .sdf file and CA_SV_TL{n}_MAXA.
            type: float
            decimal: 0
            unit: 'deg'
            num_instances: *max_num_servos
            instance_start: 1
            min: -180.0
            max: 180.0
            default: 45.0
        SIM_GZ_SV_MINA${i}:
            description:
                short: Servo ${i} Angle at Minimum
                long: |
                  Defines the angle when the servo is at the minimum.
                  Currently only supported in gz simulation and must be coherent with .sdf file and CA_SV_TL{n}_MINA.
            type: float
            decimal: 0
            unit: 'deg'
            num_instances: *max_num_servos
            instance_start: 1
            min: -180.0
            max: 180.0
            default: -45.0
    - group: Simulation
      definitions:
        SIM_GZ_EC_BIDI:
          description:
            short: Bidirectional ESC channels
            long: |
              Bitmask of simulated ESC channels driven as bidirectional. A selected channel
              sends a signed value to the Gazebo model: 0 is neutral, +MAX is full forward,
              -MAX is full reverse. The disarmed value and a failsafe value equal to it stop
              the motor. MIN must be greater than the disarmed value for full reverse to be
              reachable. Only applies to channels assigned a Peripheral via Actuator Set
              function; motor channels keep the existing mapping used by CA_R_REV models.
              Mirrors UAVCAN_EC_BIDI.
          type: bitmask
          bit:
            0: ESC1
            1: ESC2
            2: ESC3
            3: ESC4
            4: ESC5
            5: ESC6
            6: ESC7
            7: ESC8
            8: ESC9
            9: ESC10
            10: ESC11
            11: ESC12
            12: ESC13
            13: ESC14
            14: ESC15
            15: ESC16
          default: 0
          reboot_required: true

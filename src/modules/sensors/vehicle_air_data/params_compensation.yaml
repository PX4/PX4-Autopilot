module_name: vehicle_air_data
parameters:
- group: Sensors
  definitions:
    SENS_BARO_K_XP:
      description:
        short: Static pressure position error coefficient for the positive X axis
        long: |-
          Ratio of static pressure error to dynamic pressure from airflow along
          the positive X body axis. Negative if the baro altitude rises during
          forward flight.
      type: float
      default: 0.0
      min: -0.5
      max: 0.5
      decimal: 2
    SENS_BARO_K_XN:
      description:
        short: Static pressure position error coefficient for the negative X axis
        long: |-
          Ratio of static pressure error to dynamic pressure from airflow along
          the negative X body axis. Negative if the baro altitude rises during
          backwards flight.
      type: float
      default: 0.0
      min: -0.5
      max: 0.5
      decimal: 2
    SENS_BARO_K_YP:
      description:
        short: Static pressure position error coefficient for the positive Y axis
        long: |-
          Ratio of static pressure error to dynamic pressure from airflow along
          the positive Y body axis. Negative if the baro altitude rises during
          sideways flight to the right.
      type: float
      default: 0.0
      min: -0.5
      max: 0.5
      decimal: 2
    SENS_BARO_K_YN:
      description:
        short: Static pressure position error coefficient for the negative Y axis
        long: |-
          Ratio of static pressure error to dynamic pressure from airflow along
          the negative Y body axis. Negative if the baro altitude rises during
          sideways flight to the left.
      type: float
      default: 0.0
      min: -0.5
      max: 0.5
      decimal: 2
    SENS_BARO_K_Z:
      description:
        short: Static pressure position error coefficient for the Z axis
        long: Ratio of static pressure error to dynamic pressure from airflow along
          the Z body axis.
      type: float
      default: 0.0
      min: -0.5
      max: 0.5
      decimal: 2
    SENS_BARO_K_VMAX:
      description:
        short: Maximum airspeed used for baro static pressure compensation
      type: float
      default: 20.0
      min: 5.0
      max: 50.0
      unit: m/s
      decimal: 1
    SENS_BARO_K_T:
      description:
        short: Baro altitude correction per unit vertical thrust
        long: |-
          Compensates the static pressure change the propellers induce at the
          barometer, proportional to the vertical thrust setpoint magnitude:
          altitude += SENS_BARO_K_T * |thrust_z|. Negative if the baro altitude
          rises with thrust. Identify from a hover log with
          Tools/baro_compensation/baro_thrust_calibration.py.
      type: float
      default: 0.0
      min: -30.0
      max: 30.0
      unit: m
      decimal: 1

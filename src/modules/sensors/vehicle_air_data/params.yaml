module_name: vehicle_air_data
parameters:
- group: Sensors
  definitions:
    SENS_BARO_QNH:
      description:
        short: QNH for barometer
      type: float
      default: 1013.25
      min: 500
      max: 1500
      unit: hPa
    SENS_BARO_RATE:
      description:
        short: Baro max rate
        long: |-
          Barometric air data maximum publication rate. This is an upper bound,
          actual barometric data rate is still dependent on the sensor.
      type: float
      default: 20.0
      min: 1
      max: 200
      unit: Hz
    SENS_BAR_AUTOCAL:
      description:
        short: Barometer auto calibration
        long: |-
          Automatically calibrate barometer based on the GNSS height while on ground.
          Runs independently of whether the estimator fuses GNSS height.
          See SENS_BAR_AC_GATE for the plausibility check.
      category: System
      type: boolean
      default: 1
    SENS_BAR_AC_GATE:
      description:
        short: Barometer auto calibration gate
        long: |-
          Maximum allowed difference between GNSS altitude and uncalibrated baro
          altitude for the auto calibration to be applied. Otherwise the calibration
          is skipped. This limits how far a wrong or spoofed GNSS altitude can shift
          the baro. The uncalibrated baro error is mostly weather (about 8.5 m per hPa),
          so on very high or low pressure days set SENS_BARO_QNH or increase this value.
          The check is not applied if EKF2_HGT_REF is set to GPS.
          Set to 0 to disable the check.
      category: System
      type: float
      default: 50.0
      min: 0
      max: 1000
      unit: m
      decimal: 0

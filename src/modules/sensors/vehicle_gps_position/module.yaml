__max_num_gps_instances: &max_num_gps_instances 2

module_name: vehicle_gps_position

parameters:
    - group: Sensors
      definitions:
        SENS_GNSS_PRIME:
            description:
                short: Multi GPS primary instance
                long: |
                    Preferred GPS receiver instance.
                    The GPS selection logic waits until the primary receiver is available to
                    send data to the EKF even if a secondary instance is already available.
                    The secondary instance is then only used if the primary one times out.

                    To select a DroneCAN GPS, set this to the node ID.

                    GPS_RAW_INT reports the preferred receiver, or without one the first receiver
                    to publish, and GPS2_RAW the other one. Neither follows the selection.
            type: int32
            default: 0
            min: -1
            max: 127
            values:
                -1: Auto (equal priority)
                0: Main serial GPS
                1: Secondary serial GPS
        SENS_GNSS${i}_ID:
            description:
                short: GPS ${i} device ID
                long: |
                    Device ID of the GPS receiver for antenna offset slot ${i}.
                    Set to 0 to disable this slot. When all slots are 0, offsets are
                    matched by uORB instance index (only reliable for serial GPS).
            category: System
            type: int32
            default: 0
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GNSS${i}_OFFX:
            description:
                short: GPS ${i} antenna X position
                long: |
                    Forward axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GNSS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GNSS${i}_OFFY:
            description:
                short: GPS ${i} antenna Y position
                long: |
                    Right axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GNSS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GNSS${i}_OFFZ:
            description:
                short: GPS ${i} antenna Z position
                long: |
                    Down axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GNSS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GNSS${i}_DELAY:
            description:
                short: GPS ${i} measurement delay
                long: |
                    GPS measurement delay relative to IMU measurements.
                    Matched to physical GPS receiver via SENS_GNSS${i}_ID.
                    Only applied when the GPS driver does not provide its own
                    timestamp_sample correction.
            type: int32
            default: 110
            unit: ms
            min: 0
            max: 300
            num_instances: *max_num_gps_instances
            instance_start: 0

        GNSS_CHECK:
            description:
                short: Integer bitmask controlling GNSS checks
                long: 'Each threshold value is defined by the parameter indicated next to the check.
                    Drift and offset checks only run when the vehicle is on ground and stationary.
                    The spoofing and jamming checks also apply to the receiver providing the GNSS heading.'
            type: bitmask
            bit:
                0: Sat count (GNSS_REQ_NSATS)
                1: PDOP (GNSS_REQ_PDOP)
                2: EPH (GNSS_REQ_EPH)
                3: EPV (GNSS_REQ_EPV)
                4: Speed accuracy (GNSS_REQ_SACC)
                5: Horizontal position drift (GNSS_REQ_HDRIFT)
                6: Vertical position drift (GNSS_REQ_VDRIFT)
                7: Horizontal speed offset (GNSS_REQ_HDRIFT)
                8: Vertical speed offset (GNSS_REQ_VDRIFT)
                9: Spoofing
                10: GNSS fix type (GNSS_REQ_FIX)
                11: Jamming
            default: 2047
            min: 0
            max: 4095

        GNSS_REQ_EPH:
            description:
                short: Required EPH to use GNSS
            type: float
            default: 3.0
            min: 0.1
            max: 100
            unit: m
            decimal: 1

        GNSS_REQ_EPV:
            description:
                short: Required EPV to use GNSS
            type: float
            default: 5.0
            min: 0.1
            max: 100
            unit: m
            decimal: 1

        GNSS_REQ_SACC:
            description:
                short: Required speed accuracy to use GNSS
            type: float
            default: 0.5
            min: 0.5
            max: 5.0
            unit: m/s
            decimal: 2

        GNSS_REQ_NSATS:
            description:
                short: Required satellite count to use GNSS
            type: int32
            default: 6
            min: 4
            max: 12

        GNSS_REQ_PDOP:
            description:
                short: Maximum PDOP to use GNSS
            type: float
            default: 2.5
            min: 1.5
            max: 5.0
            decimal: 1

        GNSS_REQ_HDRIFT:
            description:
                short: Maximum horizontal drift speed to use GNSS
            type: float
            default: 0.1
            min: 0.1
            max: 1.0
            unit: m/s
            decimal: 2

        GNSS_REQ_VDRIFT:
            description:
                short: Maximum vertical drift speed to use GNSS
            type: float
            default: 0.2
            min: 0.1
            max: 1.5
            decimal: 2
            unit: m/s

        GNSS_REQ_FIX:
            description:
                short: Required GNSS fix
                long: Minimum GNSS fix type required for GNSS usage.
            type: enum
            values:
                0: No fix required
                2: 2D fix
                3: 3D fix
                4: RTCM code differential
                5: RTK float
                6: RTK fixed
                8: Extrapolated
            default: 3

        GNSS_REQ_TIME:
            description:
                short: Required GNSS health time on startup
                long: Minimum continuous period without GNSS failure required to mark a healthy
                    GNSS status. It can be reduced to speed up initialization, but it's recommended
                    to keep this unchanged for a vehicle.
            type: float
            default: 10.0
            min: 0.1
            decimal: 1
            unit: s

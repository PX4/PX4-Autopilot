__max_num_gps_instances: &max_num_gps_instances 2

module_name: vehicle_gps_position

parameters:
    - group: Sensors
      definitions:
        SENS_GPS_PRIME:
            description:
                short: GPS receiver reported as primary over MAVLink
                long: |
                    Selects the receiver reported in the GPS_RAW_INT MAVLink message, the
                    other one is reported in GPS2_RAW.

                    To select a DroneCAN GPS, set this to the node ID.
            type: int32
            default: 0
            min: -1
            max: 127
            values:
                -1: Auto (equal priority)
                0: Main serial GPS
                1: Secondary serial GPS
        SENS_GPS${i}_ID:
            description:
                short: GPS ${i} device ID
                long: |
                    Device ID of the GPS receiver bound to slot ${i}: its data is published as
                    vehicle_gps_position instance ${i} and configured by the SENS_GPS${i}_* parameters.
                    Set to 0 to automatically bind the first unbound receiver reporting data.
            reboot_required: true
            category: System
            type: int32
            default: 0
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFX:
            description:
                short: GPS ${i} antenna X position
                long: |
                    Forward axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFY:
            description:
                short: GPS ${i} antenna Y position
                long: |
                    Right axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFZ:
            description:
                short: GPS ${i} antenna Z position
                long: |
                    Down axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_DELAY:
            description:
                short: GPS ${i} measurement delay
                long: |
                    GPS measurement delay relative to IMU measurements.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
                    Only applied when the GPS driver does not provide its own
                    timestamp_sample correction.
            type: int32
            default: 110
            unit: ms
            min: 0
            max: 300
            num_instances: *max_num_gps_instances
            instance_start: 0

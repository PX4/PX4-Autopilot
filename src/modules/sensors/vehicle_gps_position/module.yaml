__max_num_gps_instances: &max_num_gps_instances 2

module_name: vehicle_gps_position

parameters:
    - group: Sensors
      definitions:
        SENS_GPS_MASK:
            description:
                short: Multi GPS Blending Control Mask
                long: |
                    Set bits in the following positions to set which GPS accuracy metrics will
                    be used to calculate the blending weight. Set to zero to disable and always
                    used first GPS instance.
            type: bitmask
            bit:
                0: use speed accuracy
                1: use hpos accuracy
                2: use vpos accuracy
            default: 7
            min: 0
            max: 7

        SENS_GPS_TAU:
            description:
                short: Multi GPS Blending Time Constant
                long: |
                    Sets the longest time constant that will be applied to the calculation of GPS
                    position and height offsets used to correct data from multiple GPS data for
                    steady state position differences.
            type: float
            default: 10.0
            unit: s
            decimal: 1
            min: 1.0
            max: 100.0

        SENS_GPS_PRIME:
            description:
                short: Multi GPS primary instance
                long: |
                    When no blending is active, this defines the preferred GPS receiver instance.
                    The GPS selection logic waits until the primary receiver is available to
                    send data to the EKF even if a secondary instance is already available.
                    The secondary instance is then only used if the primary one times out.

                    To select a DroneCAN GPS, set this to the node ID.

                    The primary receiver is reported in the GPS_RAW_INT MAVLink
                    message and the secondary in GPS2_RAW.

                    This parameter has no effect on the EKF GPS selection if
                    blending is active.
            type: int32
            default: 0
            min: -1
            max: 127
            values:
                -1: Auto (equal priority)
                0: Main serial GPS
                1: Secondary serial GPS
        SENS_GPS${i}_ID:
            description:
                short: GPS ${i} device ID
                long: |
                    Device ID of the GPS receiver for antenna offset slot ${i}.
                    Set to 0 to disable this slot. When all slots are 0, offsets are
                    matched by uORB instance index (only reliable for serial GPS).
            category: System
            type: int32
            default: 0
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFX:
            description:
                short: GPS ${i} antenna X position
                long: |
                    Forward axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFY:
            description:
                short: GPS ${i} antenna Y position
                long: |
                    Right axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFZ:
            description:
                short: GPS ${i} antenna Z position
                long: |
                    Down axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_DELAY:
            description:
                short: GPS ${i} measurement delay
                long: |
                    GPS measurement delay relative to IMU measurements.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
                    Only applied when the GPS driver does not provide its own
                    timestamp_sample correction.
            type: int32
            default: 110
            unit: ms
            min: 0
            max: 300
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_ROT:
            description:
                short: GPS ${i} antenna baseline rotation relative to airframe
                long: |
                    Rotation of the dual antenna baseline, moving base to rover (or antenna 1 to
                    antenna 2), relative to the vehicle body frame. No rotation: the rover
                    antenna is in front of the moving base. Yaw 90°: the rover is on the right.
                    Matched to the physical receiver via SENS_GPS${i}_ID. Not applied when the
                    receiver already reports a body frame heading.
                    Set to "Custom Euler Angle" to define the rotation using SENS_GPS${i}_ROLL,
                    SENS_GPS${i}_PITCH and SENS_GPS${i}_YAW.
            type: enum
            values:
                0: No rotation
                1: Yaw 45°
                2: Yaw 90°
                3: Yaw 135°
                4: Yaw 180°
                5: Yaw 225°
                6: Yaw 270°
                7: Yaw 315°
                8: Roll 180°
                9: Roll 180°, Yaw 45°
                10: Roll 180°, Yaw 90°
                11: Roll 180°, Yaw 135°
                12: Pitch 180°
                13: Roll 180°, Yaw 225°
                14: Roll 180°, Yaw 270°
                15: Roll 180°, Yaw 315°
                16: Roll 90°
                17: Roll 90°, Yaw 45°
                18: Roll 90°, Yaw 90°
                19: Roll 90°, Yaw 135°
                20: Roll 270°
                21: Roll 270°, Yaw 45°
                22: Roll 270°, Yaw 90°
                23: Roll 270°, Yaw 135°
                24: Pitch 90°
                25: Pitch 270°
                26: Pitch 180°, Yaw 90°
                27: Pitch 180°, Yaw 270°
                28: Roll 90°, Pitch 90°
                29: Roll 180°, Pitch 90°
                30: Roll 270°, Pitch 90°
                31: Roll 90°, Pitch 180°
                32: Roll 270°, Pitch 180°
                33: Roll 90°, Pitch 270°
                34: Roll 180°, Pitch 270°
                35: Roll 270°, Pitch 270°
                36: Roll 90°, Pitch 180°, Yaw 90°
                37: Roll 90°, Yaw 270°
                38: Roll 90°, Pitch 68°, Yaw 293°
                39: Pitch 315°
                40: Roll 90°, Pitch 315°
                100: Custom Euler Angle
            min: 0
            max: 100
            default: 0
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_ROLL:
            description:
                short: GPS ${i} baseline custom Euler Roll angle
                long: Setting this parameter changes SENS_GPS${i}_ROT to "Custom Euler Angle"
            type: float
            default: 0.0
            min: -180
            max: 180
            unit: deg
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_PITCH:
            description:
                short: GPS ${i} baseline custom Euler Pitch angle
                long: Setting this parameter changes SENS_GPS${i}_ROT to "Custom Euler Angle"
            type: float
            default: 0.0
            min: -180
            max: 180
            unit: deg
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_YAW:
            description:
                short: GPS ${i} baseline custom Euler Yaw angle
                long: Setting this parameter changes SENS_GPS${i}_ROT to "Custom Euler Angle"
            type: float
            default: 0.0
            min: -180
            max: 180
            unit: deg
            num_instances: *max_num_gps_instances
            instance_start: 0

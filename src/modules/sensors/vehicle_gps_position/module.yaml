__max_num_gps_instances: &max_num_gps_instances 2

module_name: vehicle_gps_position

parameters:
    - group: Sensors
      definitions:
        SENS_GPS_MASK:
            description:
                short: Multi GPS Blending Control Mask
                long: |
                    Set bits in the following positions to set which GPS accuracy metrics will
                    be used to calculate the blending weight. Set to zero to disable and always
                    used first GPS instance.
            type: bitmask
            bit:
                0: use speed accuracy
                1: use hpos accuracy
                2: use vpos accuracy
            default: 7
            min: 0
            max: 7

        SENS_GPS_TAU:
            description:
                short: Multi GPS Blending Time Constant
                long: |
                    Sets the longest time constant that will be applied to the calculation of GPS
                    position and height offsets used to correct data from multiple GPS data for
                    steady state position differences.
            type: float
            default: 10.0
            unit: s
            decimal: 1
            min: 1.0
            max: 100.0

        SENS_GPS_PRIME:
            description:
                short: Multi GPS primary instance
                long: |
                    When no blending is active, this defines the preferred GPS receiver instance.
                    The GPS selection logic waits until the primary receiver is available to
                    send data to the EKF even if a secondary instance is already available.
                    The secondary instance is then only used if the primary one times out.

                    To select a DroneCAN GPS, set this to the node ID.

                    The primary receiver is reported in the GPS_RAW_INT MAVLink
                    message and the secondary in GPS2_RAW.

                    This parameter has no effect on the EKF GPS selection if
                    blending is active.
            type: int32
            default: 0
            min: -1
            max: 127
            values:
                -1: Auto (equal priority)
                0: Main serial GPS
                1: Secondary serial GPS
        SENS_GPS${i}_ID:
            description:
                short: GPS ${i} device ID
                long: |
                    Device ID of the GPS receiver for antenna offset slot ${i}.
                    Set to 0 to disable this slot. When all slots are 0, offsets are
                    matched by uORB instance index (only reliable for serial GPS).
            category: System
            type: int32
            default: 0
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFX:
            description:
                short: GPS ${i} antenna X position
                long: |
                    Forward axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFY:
            description:
                short: GPS ${i} antenna Y position
                long: |
                    Right axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFZ:
            description:
                short: GPS ${i} antenna Z position
                long: |
                    Down axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_DELAY:
            description:
                short: GPS ${i} measurement delay
                long: |
                    GPS measurement delay relative to IMU measurements.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
                    Only applied when the GPS driver does not provide its own
                    timestamp_sample correction.
            type: int32
            default: 110
            unit: ms
            min: 0
            max: 300
            num_instances: *max_num_gps_instances
            instance_start: 0

        GPS_CHECK:
            description:
                short: Integer bitmask controlling GPS checks.
                long: |
                    Each threshold value is defined by the parameter indicated next to the check. Drift and offset checks only run when the vehicle is on ground and stationary.
                    Bitmask:

                        0: Sat count (EKF2_REQ_NSATS)
                        1: PDOP (EKF2_REQ_PDOP)
                        2: EPH (EKF2_REQ_EPH)
                        3: EPV (EKF2_REQ_EPV)
                        4: Speed accuracy (EKF2_REQ_SACC)
                        5: Horizontal position drift (EKF2_REQ_HDRIFT)
                        6: Vertical position drift (EKF2_REQ_VDRIFT)
                        7: Horizontal speed offset (EKF2_REQ_HDRIFT)
                        8: Vertical speed offset (EKF2_REQ_VDRIFT)
                        9: Spoofing
                        10: GPS fix type (EKF2_REQ_FIX)
                        11: Jamming
            type: int32
            min: 0
            max: 4095
            default: 2047

        REQ_NSATS:
            description:
                short: Required satellite count to use GNSS.

            type: int32
            min: 4
            max: 12
            default: 6

        REQ_PDOP:
            description:
                short: Maximum PDOP to use GPS.

            type: float
            min: 1.5
            max: 5.0
            default: 2.5

        REQ_EPH:
            description:
                short: Required EPH to use GPS.

            type: float
            min: 0.1
            max: 100
            default: 3.0
            unit: m

        REQ_EPV:
            description:
                short: Required EPV to use GPS.

            type: float
            min: 0.1
            max: 100
            default: 5.0
            unit: m

        REQ_SACC:
            description:
                short: Required speed accuracy to use GPS.

            type: float
            min: 0.5
            max: 5.0
            default: 0.5
            unit: m/s

        REQ_HDRIFT:
            description:
                short: Maximum horizontal drift speed to use GPS.

            type: float
            min: 0.1
            max: 1.0
            default: 0.1
            unit: m/s

        REQ_VDRIFT:
            description:
                short: Maximum vertical drift speed to use GPS.

            type: float
            min: 0.1
            max: 1.5
            default: 0.2
            unit: m/s

        REQ_FIX:
            description:
                short: Required GPS fix.
                long: |
                    Minimum GPS fix type required for GPS usage.

                    Values:

                        0: No fix required
                        2: 2D fix
                        3: 3D fix
                        4: RTCM code differential
                        5: RTK float
                        6: RTK fixed
                        8: Extrapolated

            type: int32
            default: 3

        REQ_GPS_H:
            description:
                short: Required GPS health time on startup.
                long: |
                    Minimum continuous period without GPS failure required to mark a healthy GPS status.
                    It can be reduced to speed up initialization, but it's recommended to keep this unchanged for a vehicle.

            type: float
            min: 0.1
            default: 10.0
            unit: s

__max_num_gps_instances: &max_num_gps_instances 2

module_name: vehicle_gps_position

parameters:
    - group: Sensors
      definitions:
        SENS_GPS_MASK:
            description:
                short: Multi GPS Blending Control Mask
                long: |
                    Set bits in the following positions to set which GPS accuracy metrics will
                    be used to calculate the blending weight. Set to zero to disable and always
                    used first GPS instance.
            type: bitmask
            bit:
                0: use speed accuracy
                1: use hpos accuracy
                2: use vpos accuracy
            default: 7
            min: 0
            max: 7

        SENS_GPS_TAU:
            description:
                short: Multi GPS Blending Time Constant
                long: |
                    Sets the longest time constant that will be applied to the calculation of GPS
                    position and height offsets used to correct data from multiple GPS data for
                    steady state position differences.
            type: float
            default: 10.0
            unit: s
            decimal: 1
            min: 1.0
            max: 100.0

        SENS_GPS_PRIME:
            description:
                short: Multi GPS primary instance
                long: |
                    When no blending is active, this defines the preferred GPS receiver instance.
                    The preferred receiver is used while it meets EKF2_REQ_FIX, EKF2_REQ_EPH
                    and EKF2_REQ_EPV, even if another receiver reports a better fix type or
                    accuracy. The selection switches to another receiver immediately if the
                    selected receiver times out or loses its 3D fix, or after the selected
                    receiver hasn't met the requirements for 2 seconds while the other one meets
                    them. It returns to the preferred receiver once that one has met the
                    requirements for 2 seconds.

                    For a moving base and rover setup, set the moving base as preferred receiver.
                    It has a higher update rate and a lower latency than the rover, which often
                    reports a better fix type but is the worse position source.

                    Set to -1 for setups without a natural preference, such as two independent
                    RTK receivers. The receivers are then ranked: a receiver meeting
                    EKF2_REQ_FIX, EKF2_REQ_EPH and EKF2_REQ_EPV ranks first, then the one with
                    the better reported position accuracy (eph, epv), then the one with the
                    higher update rate. The selection switches to another receiver after it has
                    ranked better for 2 seconds: it meets the requirements and the selected
                    receiver doesn't, it has at least 30% better accuracy or, at comparable
                    accuracy, a higher update rate. It switches immediately if the selected
                    receiver times out or loses its 3D fix.

                    To select a DroneCAN GPS, set this to the node ID.

                    The primary receiver is reported in the GPS_RAW_INT MAVLink
                    message and the secondary in GPS2_RAW.

                    This parameter has no effect on the EKF GPS selection if
                    blending is active.
            type: int32
            default: 0
            min: -1
            max: 127
            values:
                -1: Auto (equal priority)
                0: Main serial GPS
                1: Secondary serial GPS
        SENS_GPS${i}_ID:
            description:
                short: GPS ${i} device ID
                long: |
                    Device ID of the GPS receiver for antenna offset slot ${i}.
                    Set to 0 to disable this slot. When all slots are 0, offsets are
                    matched by uORB instance index (only reliable for serial GPS).
            category: System
            type: int32
            default: 0
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFX:
            description:
                short: GPS ${i} antenna X position
                long: |
                    Forward axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFY:
            description:
                short: GPS ${i} antenna Y position
                long: |
                    Right axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_OFFZ:
            description:
                short: GPS ${i} antenna Z position
                long: |
                    Down axis relative to vehicle centre of gravity.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_DELAY:
            description:
                short: GPS ${i} measurement delay
                long: |
                    GPS measurement delay relative to IMU measurements.
                    Matched to physical GPS receiver via SENS_GPS${i}_ID.
                    Only applied when the GPS driver does not provide its own
                    timestamp_sample correction.
            type: int32
            default: 110
            unit: ms
            min: 0
            max: 300
            num_instances: *max_num_gps_instances
            instance_start: 0

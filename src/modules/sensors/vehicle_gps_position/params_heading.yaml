__max_num_gps_instances: &max_num_gps_instances 2

module_name: vehicle_gps_position

parameters:
    - group: Sensors
      definitions:
        SENS_GPS${i}_HDG:
            description:
                short: GPS ${i} heading baseline
                long: |
                    Antenna baseline of the dual antenna heading reported by the receiver in slot ${i}
                    (matched via SENS_GPS${i}_ID). The heading is only used when the reported baseline
                    length is within 20% of the configured baseline.
                    Moving base: the baseline runs from the moving base receiver's antenna, in the other
                    slot, to this receiver's antenna (SENS_GPSn_OFFX/Y/Z of both slots).
                    Custom: the baseline is SENS_GPS${i}_BLX/Y/Z, for a single receiver with two antennas.
            type: enum
            values:
                0: Disabled
                1: Moving base
                2: Custom
            default: 0
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_BLX:
            description:
                short: GPS ${i} custom heading baseline X
                long: |
                    Forward component of the vector from the antenna the receiver measures the heading from
                    to the antenna it points to. Used when SENS_GPS${i}_HDG is Custom.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            min: -10
            max: 10
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_BLY:
            description:
                short: GPS ${i} custom heading baseline Y
                long: |
                    Right component of the vector from the antenna the receiver measures the heading from
                    to the antenna it points to. Used when SENS_GPS${i}_HDG is Custom.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            min: -10
            max: 10
            num_instances: *max_num_gps_instances
            instance_start: 0

        SENS_GPS${i}_BLZ:
            description:
                short: GPS ${i} custom heading baseline Z
                long: |
                    Down component of the vector from the antenna the receiver measures the heading from
                    to the antenna it points to. Used when SENS_GPS${i}_HDG is Custom.
            type: float
            default: 0.0
            unit: m
            decimal: 3
            min: -10
            max: 10
            num_instances: *max_num_gps_instances
            instance_start: 0

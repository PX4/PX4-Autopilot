module_name: logger
parameters:
- group: SD Logging
  definitions:
    SDLOG_UTC_OFFSET:
      description:
        short: 'UTC offset (unit: min)'
        long: the difference in hours and minutes from Coordinated Universal Time
          (UTC) for a your place and date. for example, In case of South Korea(UTC+09:00),
          UTC offset is 540 min (9*60) refer to https://en.wikipedia.org/wiki/List_of_UTC_time_offsets
      type: int32
      default: 0
      unit: min
      min: -1000
      max: 1000
    SDLOG_MODE:
      description:
        short: Logging Mode
        long: Only applies to SD card logging; MAVLink logging starts and stops independently.
      type: enum
      values:
        0: when armed until disarm (default)
        1: from boot until disarm
        2: from boot until shutdown
        3: while manual input AUX1 >30%
        4: from 1st armed until shutdown
      default: 0
      reboot_required: true
    SDLOG_BACKEND:
      description:
        short: Logging Backend (integer bitmask)
        long: 'If no logging is set the logger will not be started. Set bits true
          to enable: 0: SD card logging 1: Mavlink logging'
      type: bitmask
      bit:
        0: SD card logging
        1: Mavlink logging
      default: 3
      min: 0
      max: 3
      reboot_required: true
    SDLOG_BOOT_BAT:
      description:
        short: Battery-only Logging
        long: When enabled, logging will not start from boot if battery power is not
          detected (e.g. powered via USB on a test bench). This prevents extraneous
          flight logs from being created during bench testing. Note that this only
          applies to log-from-boot modes. This has no effect on arm-based modes.
      type: boolean
      default: 0
    SDLOG_MISSION:
      description:
        short: Mission Log
        long: Writes a small extra log with only the messages needed for flight statistics
          and geotagging. The full log is still written and contains all of this data.
      type: enum
      values:
        0: Disabled
        1: All mission messages
        2: Geotagging messages
      default: 0
      reboot_required: true
    SDLOG_PROFILE:
      description:
        short: Logging topic profile
        long: Each additional set increases bandwidth and log size.
      type: bitmask
      bit:
        0: Default set (general log analysis)
        1: Estimator replay (EKF2, full rate)
        2: Thermal calibration (high-rate raw IMU and baro)
        3: System identification (high-rate actuator and IMU)
        4: High rate (RC, attitude, rates and actuators)
        5: Debug (debug_*.msg topics)
        6: Sensor comparison (low-rate raw IMU, baro and mag)
        7: Computer Vision and Avoidance
        8: Raw FIFO high-rate IMU (Gyro)
        9: Raw FIFO high-rate IMU (Accel)
        10: Mavlink tunnel message logging (payload debugging)
        11: High rate sensors
      default: 1
      min: 0
      max: 4095
      reboot_required: true
    SDLOG_MAX_SIZE:
      description:
        short: Maximum log file size
        long: 'Maximum size of a single log file in mebibytes (1 MiB = 1024 * 1024
          bytes). When reached, the log file is closed and a new one is started.
          This value is also added to the cleanup threshold (see SDLOG_ROTATE) to
          reserve headroom for the next log file. A value of 0 disables both file
          rotation and the cleanup reservation.
          Must stay below the FAT32 file size limit of 4 GiB.'
      type: int32
      default: 1024
      min: 0
      max: 4095
      unit: MiB
      reboot_required: false
    SDLOG_ROTATE:
      description:
        short: Maximum disk usage percentage
        long: The limit includes the log being written. Oldest logs are deleted at log start
          (not boot), leaving room for a file of up to SDLOG_MAX_SIZE, so logs can
          be downloaded before deletion. 100 lets logs fill the disk. Set to 0 to disable.
      type: int32
      default: 90
      min: 0
      max: 100
      reboot_required: false
    SDLOG_DIRS_MAX:
      description:
        short: Maximum number of log directories to keep
        long: At log start, oldest log directories are deleted to stay within this count.
          Independent of SDLOG_ROTATE and SDLOG_MAX_SIZE, e.g. to cap logs by count in SITL.
          Set to 0 to disable.
      type: int32
      default: 0
      min: 0
      max: 1000
      reboot_required: false
    SDLOG_UUID:
      description:
        short: Log UUID
        long: If set to 1, add an ID to the log, which uniquely identifies the vehicle
      type: boolean
      default: 1

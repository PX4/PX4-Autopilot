# MAVLink definitions marked <wip> (work in progress) that PX4 already ships
# and may keep shipping unguarded in beta and release builds, for now.
#
# Every other use of a WIP definition must be wrapped in
# #if PX4_MAVLINK_WIP(<NAME>) so that it is compiled out of releases (see
# the comment at the top of the generated mavlink_wip.h).
#
# This list may only shrink: Tools/mavlink/check_wip.py fails a pull request
# that adds an entry. Remove an entry once its definition has been released
# upstream (no longer WIP) or its uses are guarded; the lint reports entries
# that are no longer needed.
#
# A message, enum or enum entry used in code also needs its uses wrapped in
# PX4_MAVLINK_WIP_LEGACY_BEGIN(<NAME>) / PX4_MAVLINK_WIP_LEGACY_END, which
# lets the build through with a note. A MAV_CMD handled by number
# (VEHICLE_CMD_*, NAV_CMD_*) or a stream name only needs its entry here.
#
# Building with -DPX4_MAVLINK_WIP_LEGACY=OFF ignores this list.
#
# name:   MAVLink name of the definition
# reason: why it ships unguarded, and what removes it from the list
# issue:  tracking issue or pull request (optional)
# added:  date added

legacy:
  - name: BATTERY_INFO
    reason: >-
      WIP in common.xml; sent by the BATTERY_INFO stream. Removed from the
      list once the message is released upstream.
    issue: https://github.com/mavlink/mavlink/pull/2592
    added: 2026-11-19

  - name: TIME_ESTIMATE_TO_TARGET
    reason: >-
      WIP in common.xml; sent by the TIME_ESTIMATE_TO_TARGET stream, which is
      in the default stream sets. Removed from the list once the message is
      released upstream or the stream is guarded.
    added: 2026-11-19

  - name: MAV_CMD_ACTUATOR_GROUP_TEST
    reason: >-
      WIP in development.xml; handled by number as
      VEHICLE_CMD_ACTUATOR_GROUP_TEST in commander and control_allocator.
    added: 2026-11-19

  - name: MAV_CMD_EXTERNAL_ATTITUDE_ESTIMATE
    reason: >-
      WIP in development.xml; handled by number as
      VEHICLE_CMD_EXTERNAL_ATTITUDE_ESTIMATE in commander and ekf2.
    added: 2026-11-19

  - name: MAV_CMD_ESTIMATOR_SENSOR_ENABLE
    reason: >-
      WIP in development.xml; handled by number as
      VEHICLE_CMD_ESTIMATOR_SENSOR_ENABLE in commander and ekf2.
    added: 2026-11-19

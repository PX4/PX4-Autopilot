module_name: mc_rate_control
parameters:
- group: Multicopter Acro Mode
  definitions:
    MC_ACRO_R_MAX:
      description:
        short: Acro mode maximum roll rate
        long: Full stick deflection leads to this rate.
      type: float
      default: 100.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
    MC_ACRO_P_MAX:
      description:
        short: Acro mode maximum pitch rate
        long: Full stick deflection leads to this rate.
      type: float
      default: 100.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
    MC_ACRO_Y_MAX:
      description:
        short: Acro mode maximum yaw rate
        long: Full stick deflection leads to this rate.
      type: float
      default: 100.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
    MC_ACRO_EXPO:
      description:
        short: Acro mode roll, pitch expo factor
        long: Shape of the stick input curve, from 0 (linear) to 1 (cubic).
      type: float
      default: 0.0
      min: 0
      max: 1
      decimal: 2
    MC_ACRO_EXPO_Y:
      description:
        short: Acro mode yaw expo factor
        long: Shape of the stick input curve, from 0 (linear) to 1 (cubic).
      type: float
      default: 0.0
      min: 0
      max: 1
      decimal: 2
    MC_ACRO_SUPEXPO:
      description:
        short: Acro mode roll, pitch super expo factor
        long: Refines the stick input curve shape set by MC_ACRO_EXPO. Set to 0 to disable. 0.7 gives an intuitive stick feel, and
          at 0.95 only stick positions near the maxima have an effect.
      type: float
      default: 0.0
      min: 0
      max: 0.95
      decimal: 2
    MC_ACRO_SUPEXPOY:
      description:
        short: Acro mode yaw super expo factor
        long: Refines the stick input curve shape set by MC_ACRO_EXPO_Y. Set to 0 to disable. 0.7 gives an intuitive stick feel, and
          at 0.95 only stick positions near the maxima have an effect.
      type: float
      default: 0.0
      min: 0
      max: 0.95
      decimal: 2

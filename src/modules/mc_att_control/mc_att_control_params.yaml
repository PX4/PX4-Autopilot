module_name: mc_att_control
parameters:
- group: Multicopter Attitude Control
  definitions:
    MC_ROLL_P:
      description:
        short: Roll P gain
        long: Roll proportional gain, i.e. desired angular speed in rad/s for error
          1 rad.
      type: float
      default: 4.0
      min: 0.0
      max: 12
      decimal: 2
      increment: 0.1
    MC_PITCH_P:
      description:
        short: Pitch P gain
        long: Pitch proportional gain, i.e. desired angular speed in rad/s for error
          1 rad.
      type: float
      default: 4.0
      min: 0.0
      max: 12
      decimal: 2
      increment: 0.1
    MC_YAW_P:
      description:
        short: Yaw P gain
        long: Yaw proportional gain, i.e. desired angular speed in rad/s for error
          1 rad.
      type: float
      default: 2.8
      min: 0.0
      max: 5
      decimal: 2
      increment: 0.1
    MC_YAW_WEIGHT:
      description:
        short: Yaw weight
        long: |-
          A fraction [0,1] deprioritizing yaw compared to roll and pitch in non-linear attitude control.
          Deprioritizing yaw is necessary because multicopters have much less control authority
          in yaw compared to the other axes and it makes sense because yaw is not critical for
          stable hovering or 3D navigation.

          For yaw control tuning use MC_YAW_P. This ratio has no impact on the yaw gain.
      type: float
      default: 0.4
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.1
    MC_ROLLRATE_MAX:
      description:
        short: Max roll rate
        long: |-
          Limit for roll rate in manual and auto modes (except acro).
          Has effect for large rotations in autonomous mode, to avoid large control
          output and mixer saturation.

          This is not only limited by the vehicle's properties, but also by the maximum
          measurement rate of the gyro.
      type: float
      default: 220.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
    MC_PITCHRATE_MAX:
      description:
        short: Max pitch rate
        long: |-
          Limit for pitch rate in manual and auto modes (except acro).
          Has effect for large rotations in autonomous mode, to avoid large control
          output and mixer saturation.

          This is not only limited by the vehicle's properties, but also by the maximum
          measurement rate of the gyro.
      type: float
      default: 220.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
    MC_YAWRATE_MAX:
      description:
        short: Max yaw rate
      type: float
      default: 200.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
    MC_REF_W_N:
      description:
        short: Attitude reference-model natural frequency
        long: |-
          Bandwidth of the reference model that smooths the attitude setpoint
          and generates the rate feed-forward. Higher = less lag, more peak
          rate demand.
      type: float
      default: 50.0
      unit: rad/s
      min: 1.0
      max: 200.0
      decimal: 0
      increment: 1
    MC_REF_FF:
      description:
        short: Attitude reference-model feed-forward gain
        long: |-
          Scale on the reference-model rate feed-forward. 0 disables it.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.01
    MC_REF_FF_MAX:
      description:
        short: Feed-forward angular-rate cap; 0 = disabled
        long: |-
          Per-axis cap on the rate feed-forward.
      type: float
      default: 100.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 0
      increment: 5
    MC_REF_ACC_R_MAX:
      description:
        short: Attitude reference-model roll acceleration limit
        long: |-
          Limits the angular acceleration of the attitude reference model on the roll axis.
          With a limit the reference follows a jerk-limited (MC_REF_JERK_MAX), time-optimal
          trajectory towards the attitude setpoint, bounded by MC_ROLLRATE_MAX, and the rate
          feed-forward reflects that trajectory.

          0 disables the limit and the axis uses the linear reference model (MC_REF_W_N).
      type: float
      default: 0.0
      unit: deg/s^2
      min: 0.0
      max: 3600.0
      decimal: 0
      increment: 10
    MC_REF_ACC_P_MAX:
      description:
        short: Attitude reference-model pitch acceleration limit
        long: |-
          Limits the angular acceleration of the attitude reference model on the pitch axis.
          With a limit the reference follows a jerk-limited (MC_REF_JERK_MAX), time-optimal
          trajectory towards the attitude setpoint, bounded by MC_PITCHRATE_MAX, and the rate
          feed-forward reflects that trajectory.

          0 disables the limit and the axis uses the linear reference model (MC_REF_W_N).
      type: float
      default: 0.0
      unit: deg/s^2
      min: 0.0
      max: 3600.0
      decimal: 0
      increment: 10
    MC_REF_ACC_Y_MAX:
      description:
        short: Attitude reference-model yaw acceleration limit
        long: |-
          Limits the angular acceleration of the attitude reference model on the yaw axis.
          With a limit the reference follows a jerk-limited (MC_REF_JERK_MAX), time-optimal
          trajectory towards the attitude setpoint, bounded by MC_YAWRATE_MAX, and the rate
          feed-forward reflects that trajectory.

          0 disables the limit and the axis uses the linear reference model (MC_REF_W_N).
      type: float
      default: 0.0
      unit: deg/s^2
      min: 0.0
      max: 3600.0
      decimal: 0
      increment: 10
    MC_REF_JERK_MAX:
      description:
        short: Attitude reference-model angular jerk limit
        long: |-
          Maximum angular jerk of the acceleration-limited reference model (MC_REF_ACC_*_MAX).
          It bounds how fast the reference acceleration ramps in and out and thereby also how
          quickly the reference closes small setpoint changes: close to the setpoint the
          reference rate is proportional to the remaining angle with the gain
          MC_REF_JERK_MAX / (2 * MC_REF_ACC_*_MAX). Higher = crisper, lower = smoother response.
      type: float
      default: 10000.0
      unit: deg/s^3
      min: 100.0
      max: 100000.0
      decimal: 0
      increment: 100
- group: Multicopter Position Control
  definitions:
    MC_MAN_TILT_TAU:
      description:
        short: Manual tilt input filter time constant
        long: Setting this parameter to 0 disables the filter
      type: float
      default: 0.0
      unit: s
      min: 0.0
      max: 2.0
      decimal: 2

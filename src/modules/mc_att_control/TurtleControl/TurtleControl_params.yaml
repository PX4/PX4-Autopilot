module_name: Multicopter Turtle Recovery
parameters:
  - group: Multicopter Turtle Recovery
    definitions:
      TRTL_EN:
        description:
          short: Enable turtle recovery
          long: Requires a fixed Quad-X with non-3D DShot ESCs supporting temporary direction commands 20 and 21.
        type: boolean
        default: 0
        reboot_required: true
      TRTL_MAX:
        description:
          short: Maximum turtle thrust
          long: Applied at full roll or pitch stick deflection.
        type: float
        default: 0.3
        min: 0.01
        max: 1.0
        decimal: 2
      TRTL_TIME:
        description:
          short: Maximum continuous turtle drive time
          long: Centre roll and pitch sticks before another attempt.
        type: float
        default: 1.0
        min: 0.1
        max: 3.0
        unit: s
        decimal: 1

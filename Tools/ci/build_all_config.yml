# Build All Targets CI Configuration
#
# Controls board grouping, cache sizes, runner specs, and seeder targets
# for the build_all_targets workflow. Forks can customize this file to
# adjust for their infrastructure (e.g., lower cache sizes for GitHub's
# 10GB cache limit, fewer CPU cores for smaller runners).

# Container images
containers:
  default: "ghcr.io/px4/px4-dev:v1.18.0-beta2"
  voxl2: "ghcr.io/px4/px4-dev-voxl2:v1.8"

# Runner specs
runners:
  seeder_cpu: 8
  matrix_cpu: 4
  # Targets each build job compiles concurrently, each in its own git
  # worktree (NuttX builds inside its source tree, so one per checkout).
  # 2 keeps a 4-vCPU runner ~80% busy; more slots or larger runners cost more
  # than they save (PR #28870). 1 = sequential.
  build_slots: 2

# Default ccache max-size for build groups
cache:
  default_size: "400M"
  # Per-chip overrides for groups with many diverse boards
  chip_sizes:
    stm32h7: "800M"
    stm32f4: "800M"
    stm32f7: "800M"
    imxrt: "800M"
    # voxl2 cache holds objects for two toolchains (aarch64-gnu + hexagon-clang)
    voxl2: "800M"

# Board grouping limits
grouping:
  # Max targets per group, tuned for ~10 min wall-clock with warm cache
  chip_split_limits:
    stm32h7: 10
    stm32f7: 12
    stm32f4: 20
    stm32f1: 39
    imxrt: 12
    kinetis: 14
    s32k: 17
    rp2040: 10
    special: 10
    native: 17
  default_split_limit: 12
  # Minimum targets for a manufacturer to get a named group
  lower_limit: 3
  # If last chunk has fewer targets than this, merge into previous chunk
  merge_back_threshold: 5

# Labels that isolate builds into the "special" group
special_labels:
  - lto
  - protected

# Targets that are built but not published: nothing from them reaches S3, a
# GitHub Release or the build artifacts of a pull request. They are in the
# build matrix for compile coverage, analysis or testing, and are not firmware
# anyone should flash. Each entry says why. Tools/ci/test_package_build_artifacts.py
# fails when an entry no longer matches a target in the tree.
unpublished:
  # Every target with this label (boards/<vendor>/<board>/<label>.px4board)
  labels:
    flash-analysis: linked against an oversized flash region, for flash_analysis.yml
    allyes: every option enabled, for compile coverage
    performance-test: test firmware without a flight stack
    bench: tooling for the bench test suite
    lto: link-time optimization coverage
    secureboot: signed with the test keys kept in the tree
    bootloader_secureboot: signed with the test keys kept in the tree
    cryptotest: uses the test keys kept in the tree
    test-daa-crosstrack: unit test configuration
  # Single targets, where other targets with the same label are user firmware
  targets:
    px4_fmu-v5_debug: NuttX debug and OS test build

# NXP chip families are pooled under "nxp-{chip}" regardless of board directory
nxp_chip_families:
  - imxrt
  - imx9
  - kinetis
  - s32k

# Seeder targets: one representative build per chip family
seeders:
  stm32h7: "px4_fmu-v6x_default"
  stm32f7: "px4_fmu-v5_default"
  stm32f4: "px4_fmu-v4_default"
  stm32f1: "px4_io-v2_default"
  imxrt: "nxp_mr-tropic_default"
  imx9: "nxp_mr-navq95_default"
  kinetis: "nxp_fmuk66-v3_default"
  s32k: "nxp_mr-canhubk3_default"
  rp2040: "raspberrypi_pico_default"
  special: "px4_fmu-v6x_default"
  native: "px4_sitl_default"
  voxl2: "modalai_voxl2_default"

name: Sync release branch to px4_msgs and px4-ros2-interface-lib

on:
  create:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch name (e.g. release/1.18)'
        required: true
        type: string

permissions: {}

jobs:
  # px4_msgs goes first, so its release branch already exists when the
  # interface library is told to create the branch that builds against it.
  sync-px4-msgs:
    if: >-
      github.repository == 'PX4/PX4-Autopilot' &&
      (
        (github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')) ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
    uses: ./.github/workflows/sync_to_px4_msgs.yml
    with:
      branch: ${{ inputs.branch || github.ref_name }}
    secrets: inherit

  notify-interface-lib:
    needs: sync-px4-msgs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PX4BUILTBOT_PERSONAL_ACCESS_TOKEN }}
      BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      # gh prints the HTTP status and GitHub's message when the dispatch is refused
      - name: Dispatch release branch creation
        run: >-
          gh api repos/Auterion/px4-ros2-interface-lib/dispatches
          -f event_type=px4_release_branch
          -f "client_payload[branch]=$BRANCH"

name: Tag px4_msgs from PX4 release tags

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'PX4 tag to propagate (example: v1.17.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag_px4_msgs:
    if: github.repository == 'PX4/PX4-Autopilot'
    runs-on: [runs-on,runner=4cpu-linux-x64,image=ubuntu22-full-x64,"run-id=${{ github.run_id }}",spot=false]
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      # read by gh's git credential helper at push time
      GH_TOKEN: ${{ secrets.PX4BUILTBOT_PERSONAL_ACCESS_TOKEN }}
      # fail on a rejected token instead of prompting for a username
      GIT_TERMINAL_PROMPT: 0
    steps:
      - name: Checkout PX4 repo
        uses: actions/checkout@v6

      - name: Setup git credentials
        run: |
          git config --global user.name "${{ secrets.PX4BUILDBOT_USER }}"
          git config --global user.email "${{ secrets.PX4BUILDBOT_EMAIL }}"
          # same reason as in sync_to_px4_msgs.yml: a token in the clone URL is dropped before the push
          gh auth setup-git

      - name: Tag px4_msgs
        run: Tools/ci/px4_msgs_tag.sh "$TAG_NAME"

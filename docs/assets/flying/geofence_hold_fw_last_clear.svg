.zone{font-family:"Barlow Semi Condensed","Liberation Sans Narrow",sans-serif;font-size:15px;font-weight:600;letter-spacing:.06em;fill:#5b6965}
.in{fill:#e3efe8}.out{fill:#f6e2df}

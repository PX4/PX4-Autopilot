<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Pre-geofence margin</title>
  <desc id="desc">Top view of a geofence, drawn as a solid line, with the pre-geofence drawn as a dashed line at the distance GF_PRE_MARGIN inside it and around an exclusion area. A fixed-wing vehicle flies from Home towards the boundary. Where it comes closer to the geofence than the margin, the pre-geofence action Hold is triggered, and the vehicle loiters around that position without reaching the geofence.</desc>
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #1f2a2e; }
    .small { font-size: 12px; fill: #51606a; }
    .hard-text { fill: #8f2b20; font-weight: 600; }
    .pre-text { fill: #7a4d0c; font-weight: 600; }
    .outside { fill: #f6dedb; }
    .buffer { fill: #fdf0cf; }
    .inside { fill: #eaf3ee; }
    .hard { stroke: #b23a2c; stroke-width: 3; stroke-linejoin: round; }
    .pre { stroke: #b7791f; stroke-width: 2.5; stroke-dasharray: 9 5; stroke-linejoin: round; }
    .track { stroke: #33547d; stroke-width: 2.5; fill: none; }
    .avoided { stroke: #33547d; stroke-width: 2; stroke-dasharray: 3 5; fill: none; opacity: 0.75; }
    .orbit { stroke: #2f7d55; stroke-width: 2.5; fill: none; }
    .trigger { fill: #b7791f; stroke: #fff; stroke-width: 1.5; }
    .breach { stroke: #b23a2c; stroke-width: 3; stroke-linecap: round; }
    .home { fill: #33547d; }
    .dim { stroke: #51606a; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#33547d"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#51606a"/>
    </marker>
  </defs>

  <!-- outside, then the geofence with the margin colour, then the area that keeps the margin -->
  <rect class="outside" width="760" height="420"/>
  <rect class="hard buffer" x="30" y="50" width="610" height="290"/>
  <rect class="pre inside" x="86" y="106" width="498" height="178"/>

  <!-- exclusion area: the margin surrounds it as well -->
  <circle class="pre buffer" cx="262" cy="195" r="76"/>
  <circle class="hard outside" cx="262" cy="188" r="20"/>

  <!-- flight from Home, Hold where the vehicle enters the margin -->
  <path class="avoided" d="M 584 222 L 652 222"/>
  <path class="track" d="M 380 262 C 440 262 500 222 580 222" marker-end="url(#head)"/>
  <circle class="orbit" cx="584" cy="222" r="44"/>
  <circle class="home" cx="380" cy="262" r="6"/>
  <circle class="trigger" cx="584" cy="222" r="6"/>
  <path class="breach" d="M 633 215 L 647 229 M 647 215 L 633 229"/>

  <!-- the margin -->
  <line class="dim" x1="589" y1="78" x2="635" y2="78" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text class="small" x="576" y="82" text-anchor="end">GF_PRE_MARGIN</text>

  <text class="hard-text" x="36" y="40">Geofence</text>
  <text class="pre-text" x="98" y="130">Pre-geofence</text>
  <text class="small" x="262" y="236" text-anchor="middle">Exclusion area</text>
  <text x="368" y="267" text-anchor="end">Home</text>

  <text x="540" y="150" text-anchor="end">Within the margin: Hold</text>
  <text class="small" x="540" y="168" text-anchor="end">(fixed-wing: loiter around this position)</text>

  <text x="660" y="186">Without the</text>
  <text x="660" y="203">pre-geofence:</text>
  <text x="660" y="252">breach,</text>
  <text x="660" y="269">GF_ACTION</text>

  <!-- legend -->
  <line class="hard" x1="45" y1="388" x2="85" y2="388"/>
  <text x="95" y="393">Geofence (GF_ACTION)</text>
  <line class="pre" x1="330" y1="388" x2="370" y2="388"/>
  <text x="380" y="393">Pre-geofence (GF_PRE_ACTION)</text>
</svg>

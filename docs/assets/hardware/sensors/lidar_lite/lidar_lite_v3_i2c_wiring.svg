<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
  <title id="title">LIDAR-Lite v3 I2C wiring to a flight controller</title>
  <desc id="desc">LIDAR-Lite v3 pin 1 (red) connects to a 5 V DC supply. Pin 4, I2C SCL (green), and pin 5, I2C SDA (blue), connect to the flight controller I2C SCL and SDA pins. Pin 6 (black) connects to flight controller ground. A 680 microfarad electrolytic capacitor is connected between the 5 V DC and ground wires, with its positive side to 5 V DC. Pins 2 and 3 are not connected.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f3f4f6; stroke: #111827; stroke-width: 2; }
      .title { font: 700 17px sans-serif; fill: #111827; }
      .label { font: 14px sans-serif; fill: #111827; }
      .small { font: 13px sans-serif; fill: #4b5563; }
      .wire { fill: none; stroke-width: 4; stroke-linecap: round; }
      .halo { fill: none; stroke: #ffffff; stroke-width: 12; }
      .nc { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 2 7; }
      .node { fill: #111827; }
      .pin { fill: #111827; }
      .plate { fill: none; stroke: #111827; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="800" height="380"/>

  <!-- Sensor -->
  <rect class="box" x="30" y="30" width="200" height="320" rx="8"/>
  <text class="title" x="130" y="58" text-anchor="middle">LIDAR-Lite v3</text>
  <text class="label" x="218" y="105" text-anchor="end">1  5 V DC (+)</text>
  <text class="label" x="218" y="150" text-anchor="end">2  Power enable</text>
  <text class="label" x="218" y="195" text-anchor="end">3  Mode control</text>
  <text class="label" x="218" y="240" text-anchor="end">4  I2C SCL</text>
  <text class="label" x="218" y="285" text-anchor="end">5  I2C SDA</text>
  <text class="label" x="218" y="330" text-anchor="end">6  Ground (-)</text>

  <!-- 5 V supply -->
  <rect class="box" x="585" y="75" width="190" height="50" rx="8"/>
  <text class="title" x="680" y="106" text-anchor="middle">5 V DC supply</text>

  <!-- Flight controller -->
  <rect class="box" x="585" y="150" width="190" height="200" rx="8"/>
  <text class="title" x="680" y="190" text-anchor="middle">Flight controller</text>
  <text class="label" x="598" y="240">I2C SCL</text>
  <text class="label" x="598" y="285">I2C SDA</text>
  <text class="label" x="598" y="330">GND</text>

  <!-- Capacitor between 5 V DC and ground (drawn first, so the I2C wires pass over it) -->
  <path class="wire" stroke="#111827" stroke-width="3" d="M 430 100 V 155 M 430 171 V 325"/>
  <path class="plate" d="M 412 155 H 448"/>
  <path class="plate" d="M 412 171 H 448"/>
  <text class="label" x="440" y="144">+</text>
  <text class="label" x="458" y="160">680 μF</text>
  <text class="small" x="458" y="178">capacitor</text>

  <!-- Wires -->
  <path class="wire" stroke="#dc2626" d="M 230 100 H 585"/>
  <path class="halo" d="M 418 235 H 442"/>
  <path class="wire" stroke="#16a34a" d="M 230 235 H 585"/>
  <path class="halo" d="M 418 280 H 442"/>
  <path class="wire" stroke="#2563eb" d="M 230 280 H 585"/>
  <path class="wire" stroke="#111827" d="M 230 325 H 585"/>
  <circle class="node" cx="430" cy="100" r="6"/>
  <circle class="node" cx="430" cy="325" r="6"/>

  <!-- Not connected -->
  <path class="nc" stroke="#f97316" d="M 230 145 H 290"/>
  <path class="nc" stroke="#eab308" d="M 230 190 H 290"/>
  <text class="small" x="300" y="150">not connected</text>
  <text class="small" x="300" y="195">not connected</text>

  <!-- Pins -->
  <circle class="pin" cx="230" cy="100" r="5"/>
  <circle class="pin" cx="230" cy="145" r="5"/>
  <circle class="pin" cx="230" cy="190" r="5"/>
  <circle class="pin" cx="230" cy="235" r="5"/>
  <circle class="pin" cx="230" cy="280" r="5"/>
  <circle class="pin" cx="230" cy="325" r="5"/>
  <circle class="pin" cx="585" cy="100" r="5"/>
  <circle class="pin" cx="585" cy="235" r="5"/>
  <circle class="pin" cx="585" cy="280" r="5"/>
  <circle class="pin" cx="585" cy="325" r="5"/>
</svg>

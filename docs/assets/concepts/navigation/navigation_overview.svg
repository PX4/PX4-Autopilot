  <text x="400" y="135" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#3f3f46"><tspan x="400" dy="0">Single overview figure: vehicle seen from above, north arrow, desired</tspan><tspan x="400" dy="22">track between two waypoints, heading arrow along the body x-axis,</tspan><tspan x="400" dy="22">ground velocity arrow (course over ground), drift angle between them,</tspan><tspan x="400" dy="22">bearing to the next waypoint, cross-track error as the perpendicular</tspan><tspan x="400" dy="22">to the desired track.</tspan></text>

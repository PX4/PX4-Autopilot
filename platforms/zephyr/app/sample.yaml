sample:
  name: PX4 Autopilot
  description: PX4 running on Zephyr
common:
  tags:
    - px4
tests:
  px4.app:
    platform_allow:
      - mps2/an386
    integration_platforms:
      - mps2/an386
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "HW arch: ZEPHYR_GENERIC"
        - "OS: Zephyr"

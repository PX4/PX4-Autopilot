[pytest]
# Each test case is started by mavsdk_test_runner.py against a fresh PX4
# instance, see integration_test_runner/.
addopts = --strict-markers -p no:cacheprovider
norecursedirs = integration_test_runner catch2 configs
markers =
    multicopter: multicopter tests
    vtol: VTOL tests
    offboard: offboard position/velocity control
    offboard_attitude: offboard attitude control
    vtol_wind: VTOL tests that need a windy world
    vtol_airspeed_fail: VTOL airspeed failure tests
    loiter: fixed-wing loiter tests
    controlallocation: control allocation tests
    motor_failure_injection: motor failure injection tests
    sih_home_yaw: SIH home yaw tests
    sih_xvert_transition: SIH XVert transition tests
    vision_target: vision target estimator precision landing tests
    optical_flow: optical flow aided multicopter navigation tests
    optical_flow_vtol: optical flow aided VTOL navigation tests
    takeoff_local: local-frame (VEHICLE_CMD_NAV_TAKEOFF_LOCAL) takeoff tests
